# Example only — adapt package names to the real repository, then move to the
# project's import-linter config (e.g. .importlinter or pyproject.toml).
# Start with the contracts that pass today; list existing violations in
# ignore_imports and shrink that list over time.

[importlinter]
root_package = labmango

# 1. Technical platform code must not know about business features.
[importlinter:contract:platform-is-independent]
name = platform imports no feature
type = forbidden
source_modules = labmango.platform
forbidden_modules =
    labmango.features

# 2. Features are independent of each other; they collaborate through public.py or events.
[importlinter:contract:features-independent]
name = features are independent
type = independence
modules =
    labmango.features.rooms
    labmango.features.equipment
    labmango.features.bookings
    labmango.features.licenses
    labmango.features.expenses
    labmango.features.monitoring
ignore_imports =
    # temporary, documented exceptions only:
    # labmango.features.bookings.application -> labmango.features.equipment.public

# 3. Layering inside a feature.
[importlinter:contract:feature-layers]
name = api -> application/queries -> models
type = layers
layers =
    labmango.features.bookings.api
    labmango.features.bookings.application | labmango.features.bookings.queries
    labmango.features.bookings.models
