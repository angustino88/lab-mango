[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "xlsx-reader"
version = "0.1.0"
description = "Native XLSX worksheet reader for Python"
requires-python = ">=3.12"

[tool.maturin]
features = ["extension-module"]
locked = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
    { file = "src/**/*.rs" },
]
