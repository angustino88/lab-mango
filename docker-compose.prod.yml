# Production stack for ONE department backend. Departments deploy independently (own Compose project,
# containers, image tag, Redis, volumes) and can share a host when their ports differ.
# Deploy with the helper, which decrypts the department's files and sets the variables below:
#   scripts/deploy/backend.sh deploy <department>
# Committed, all SOPS-encrypted (.envs/.production/<department>/):
#   .backend.enc   topology: ports, COMPOSE_PROFILES, optional image overrides
#   .django.enc    Django settings
#   .postgres.enc  database settings
# Server state (LABMANGO_STATE_DIR = /srv/labmango/<department> by default), never in the checkout:
#   .backend .django .postgres   decrypted on each deploy (mode 600)
#   staticfiles/                 collectstatic output, served by nginx
#   ssl/                         server.crt and server.key for nginx
# Profiles (COMPOSE_PROFILES in .backend): "nginx" when the backend runs without the router,
# "postgres" to run the database in a container instead of an external one.

x-backend-env: &backend-env
  # Topology values come from .backend so ports and identity always match the compose setup.
  BACKEND_ID: ${BACKEND_ID:-${BACKEND_NAME}}
  UVICORN_PORT: ${UVICORN_PORT}
  CELERY_BROKER_URL: redis://127.0.0.1:${REDIS_PORT}/0
  REDIS_URL: redis://127.0.0.1:${REDIS_PORT}/1

volumes:
  postgres_data: {}
  postgres_data_backups: {}

services:
  django: &django
    restart: unless-stopped
    pull_policy: build
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: labmango-backend:${BACKEND_NAME:?run through scripts/deploy/backend.sh or set BACKEND_NAME}
    container_name: labmango-${BACKEND_NAME}-django
    depends_on:
      - redis
    volumes:
      - ${LABMANGO_STATE_DIR:?run through scripts/deploy/backend.sh}/staticfiles:/app/staticfiles
    env_file:
      - ${LABMANGO_STATE_DIR}/.django
      - ${LABMANGO_STATE_DIR}/.postgres
    environment: *backend-env
    network_mode: host
    command: /start

  nginx:
    profiles: ["nginx"]
    image: nginx:1.27.3
    container_name: labmango-${BACKEND_NAME}-nginx
    restart: unless-stopped
    network_mode: host
    environment:
      UVICORN_PORT: ${UVICORN_PORT}
      NGINX_HTTP_PORT: ${NGINX_HTTP_PORT:-8081}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-8443}
    volumes:
      # The nginx image renders templates/*.template into conf.d with these variables.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ${LABMANGO_STATE_DIR}/ssl:/etc/nginx/ssl:ro
      - ${LABMANGO_STATE_DIR:?run through scripts/deploy/backend.sh}/staticfiles:/static:ro
    depends_on:
      - django

  redis:
    image: redis:7-alpine
    container_name: labmango-${BACKEND_NAME}-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

  postgres:
    profiles: ["postgres"]
    image: ${POSTGRES_IMAGE:-postgres:15.3-alpine}
    container_name: labmango-${BACKEND_NAME}-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_data_backups:/backups
    env_file:
      - ${LABMANGO_STATE_DIR}/.postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  celeryworker:
    <<: *django
    container_name: labmango-${BACKEND_NAME}-celeryworker
    depends_on:
      - redis
    network_mode: host
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    container_name: labmango-${BACKEND_NAME}-celerybeat
    depends_on:
      - redis
    network_mode: host
    ports: []
    command: /start-celerybeat
