# Local development stack. First copy the env templates:
#   cp .envs/.local/.django.example .envs/.local/.django
#   cp .envs/.local/.postgres.example .envs/.local/.postgres
#   docker compose -f docker-compose.dev.yml up --build
# API and WebSocket: http://localhost:8000 (auto-reload on code changes).

volumes:
  labmango_local_postgres_data: {}
  labmango_local_postgres_data_backups: {}
  labmango_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: labmango_local_django
    container_name: labmango-local-django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    image: postgres:18.7-alpine
    container_name: labmango-local-postgres
    volumes:
      # PostgreSQL 18+ keeps its data in /var/lib/postgresql/<major>/docker: mount the parent.
      - labmango_local_postgres_data:/var/lib/postgresql
      - labmango_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7.4.12-alpine
    container_name: labmango-local-redis
    volumes:
      - labmango_local_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

  celeryworker:
    <<: *django
    container_name: labmango-local-celeryworker
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    container_name: labmango-local-celerybeat
    ports: []
    command: /start-celerybeat
