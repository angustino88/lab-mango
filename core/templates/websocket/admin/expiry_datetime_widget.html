<div
  class="lm-dtp"
  data-lm-dtp
  data-timezone="{{ widget.timezone_name }}"
  data-allow-clear="{{ widget.allow_clear|yesno:'true,false' }}"
>
  <div class="lm-dtp__inputs">
    <label class="lm-dtp__field">
      <span class="lm-dtp__label">Date</span>
      {% with widget=widget.subwidgets.0 %}{% include widget.template_name %}{% endwith %}
    </label>
    <label class="lm-dtp__field">
      <span class="lm-dtp__label">Time</span>
      {% with widget=widget.subwidgets.1 %}{% include widget.template_name %}{% endwith %}
    </label>
    {% if widget.allow_clear %}
      <button type="button" class="lm-dtp__clear" data-preset="clear" title="Clear and use default 7-day history retention">
        Clear
      </button>
    {% endif %}
  </div>

  <div class="lm-dtp__presets" role="group" aria-label="Quick expiry presets">
    <span class="lm-dtp__presets-label">Quick pick:</span>
    <button type="button" class="lm-dtp__chip" data-preset="hours:1">+1 hour</button>
    <button type="button" class="lm-dtp__chip" data-preset="hours:2">+2 hours</button>
    <button type="button" class="lm-dtp__chip" data-preset="hours:4">+4 hours</button>
    <button type="button" class="lm-dtp__chip" data-preset="today:18:00" data-lm-dtp-today>Today 18:00</button>
    <button type="button" class="lm-dtp__chip" data-preset="tomorrow:18:00">Tomorrow 18:00</button>
    <button type="button" class="lm-dtp__chip" data-preset="days:3">+3 days</button>
    <button type="button" class="lm-dtp__chip" data-preset="days:7">+7 days</button>
  </div>

  <div class="lm-dtp__preview" data-lm-dtp-preview aria-live="polite"></div>
</div>
