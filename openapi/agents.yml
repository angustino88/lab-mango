openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /agent/bookings/actions/check-in:
    post:
      operationId: agent_check_in_booking
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Call
        when the user enters a booking code at login. Eligible only for an approved
        booking on this computer''s bench, from its start until 10 minutes later (reserved)
        or until it ends (in progress). Repeating a check-in is safe. Every failure
        returns checked_in: false with no other fields.'
      summary: Check a user in with a booking code; the booking becomes in progress
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingCheckInResponse'
          description: Check-in result
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field or invalid code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/bookings/actions/complete:
    post:
      operationId: agent_complete_booking
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Call
        only when the user chooses to end the booking, not at every logout. Only an
        approved, in-progress booking on this computer''s bench can be ended; repeating
        the call is safe. The booked end time is not changed. Every failure returns
        completed: false with no other fields.'
      summary: End a booking at the user's request; the booking becomes completed
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingCompleteResponse'
          description: End result
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field or invalid code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/bookings/actions/extend:
    post:
      operationId: agent_extend_booking
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Only
        an approved, in-progress booking on this computer''s bench can be extended:
        at least 10 minutes later than the current end, before the current end has
        passed, without overlapping the next booking, and at most 4 hours from the
        start (longer bookings need approval in the web app). Seconds are dropped.
        Repeating the same end time is safe. An unknown or foreign booking returns
        extended: false with no other fields.'
      summary: Extend a running booking at the user's request
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingExtendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingExtendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingExtendRequest'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingExtendResponse'
          description: Extension result
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingExtendError'
          description: 'bench_not_free: another booking starts at details[0].limit_at'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingExtendError'
          description: 'validation_failed: unknown field or invalid value (generic
            error envelope); extension_not_allowed: details[0].code says why (already_ended,
            not_later, too_short, needs_approval, bench_not_in_service) and details[0].limit_at
            gives the bound'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/bookings/actions/validate:
    post:
      operationId: agent_validate_booking
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Does
        not check in or change the booking. Unknown, unapproved, cancelled, finished,
        other-bench and out-of-window codes all return eligible: false with no other
        fields.'
      summary: Check whether a booking code may be used to log in on this computer
        now
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingValidationResponse'
          description: Eligibility
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field or invalid code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/device-observations/actions/report:
    post:
      operationId: agent_device_observations_actions_report_create
      description: HTTP mapping for domain commands and selector projections.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Durable UUID batch key; reuse on retry with the same content.
        required: true
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceObservationReport'
        required: true
      security:
      - observationSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeviceObservationsObservationSerializersObservationAcknowledgmentDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Report Agent Device Observations
  /agent/enrollments:
    post:
      operationId: enroll_agent
      description: Redeem an enrollment grant with agent proof (POST /agent/enrollments).
      summary: Redeem one-time grant with agent private key proof
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollAgentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnrollAgentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnrollAgentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent successfully enrolled
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid grant or proof
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Enrollment conflict
  /agent/equipment/activity:
    patch:
      operationId: agent_report_activity
      description: Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and X-Agent-Signature
        headers (see the agentSignatureAuth security scheme). Send only the fields
        that changed.
      summary: Report live activity of the agent's computer
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgentActivityReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgentActivityReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgentActivityReport'
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivityResponse'
          description: Activity recorded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The agent's computer was deleted or is no longer computing
            equipment
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field or invalid value
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/heartbeat:
    post:
      operationId: agent_heartbeat
      description: Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and X-Agent-Signature
        headers (see the agentSignatureAuth security scheme). The body may repeat
        agent_uid; if present it must equal X-Agent-Id.
      summary: Record agent heartbeat
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHeartbeatResponse'
          description: Heartbeat acknowledged
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/info:
    get:
      operationId: get_agent_info
      description: Discover agent capabilities and backend metadata (GET /agent/info).
      summary: Discover agent API capabilities and server identity
      tags:
      - Agents
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInfoResponse'
          description: Server agent metadata
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Supplied bearer credentials are invalid
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Anonymous or user request rate exceeded
  /agent/license-checks:
    get:
      operationId: agent_license_checks_retrieve
      description: The enabled checks that target this computer; strong ETag, 304
        when unchanged.
      tags:
      - Agents
      security:
      - observationSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLicenseChecksLicenseCheckSerializersAgentLicenseChecksDetailResponse'
          description: ''
        '304':
          description: Checks unchanged
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Agent License Checks
  /agent/license-checks/{check_key}/actions/report:
    post:
      operationId: agent_license_checks_actions_report_create_by_check_key
      description: One run of one check. Exact retries with the same Idempotency-Key
        are acknowledged again.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Durable UUID run key; reuse on retry with the same content.
        required: true
      - in: path
        name: check_key
        schema:
          type: string
        required: true
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseCheckRunReport'
        required: true
      security:
      - observationSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentLicenseCheckReportLicenseCheckSerializersLicenseCheckRunAcknowledgmentDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Report Agent License Checks by Check Key
  /agent/monitoring-policy:
    get:
      operationId: agent_monitoring_policy_retrieve
      description: HTTP mapping for domain commands and selector projections.
      tags:
      - Agents
      security:
      - observationSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMonitoringPolicyObservationSerializersMonitoringPolicyDetailResponse'
          description: ''
        '304':
          description: Policy unchanged
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Agent Monitoring Policy
  /agent/session-logs:
    post:
      operationId: agent_record_session_log
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Send
        once after logout. Repeat the same event_id when retrying: identical values
        return 200 with the stored record. Rejected when logout is more than 5 minutes
        ahead of server time, login is more than 7 days old, or active time exceeds
        the time between login and logout.'
      summary: Record a completed remote session
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionLogReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentSessionLogReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentSessionLogReport'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionLogResponse'
          description: Session stored
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionLogResponse'
          description: Same event already stored; no change
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Event id stored with different values, or the agent's computer
            is deleted
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field, invalid value or limit exceeded
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /api/agents:
    get:
      operationId: list_agents
      description: List agent identities or issue an initial enrollment grant.
      summary: List enrolled and pending agents
      parameters:
      - in: query
        name: equipment
        schema:
          type: string
        description: Comma-separated computing equipment ids (1..100); returns only
          their agents.
      - in: query
        name: equipment_uid
        schema:
          type: string
          format: uuid
        description: Computing equipment UID; returns only its agents.
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        description: Page number (>= 1)
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1..100, default 25)
      - in: query
        name: state
        schema:
          type: string
        description: 'Comma-separated agent states: pending, active, revoked, decommissioned.'
      tags:
      - Agents (operator)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
          description: Page of agents
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid page, page_size or filter value
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Page out of range
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
    post:
      operationId: create_agent_grant
      description: List agent identities or issue an initial enrollment grant.
      summary: Issue a one-time enrollment grant for computing equipment
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentGrantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAgentGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAgentGrantRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentGrantIssuedResponse'
          description: Enrollment grant issued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Computing equipment not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Equipment already has pending or active agent
  /api/agents/{id}:
    get:
      operationId: get_agent_detail
      description: Retrieve detail of an enrolled agent.
      summary: Retrieve agent identity detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent detail
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
  /api/agents/{id}/actions/decommission:
    post:
      operationId: decommission_agent
      description: Decommission an active agent identity.
      summary: Decommission an agent identity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent decommissioned
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
  /api/agents/{id}/actions/revoke:
    post:
      operationId: revoke_agent
      description: Revoke an active agent identity.
      summary: Revoke an agent identity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent revoked
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
  /api/agents/{id}/enrollment-grants:
    get:
      operationId: list_agent_grants
      description: Newest first. The clear grant is returned only once, by the call
        that issues it.
      summary: List an agent's enrollment grants (metadata only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        description: Page number (>= 1)
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Page size (1..100, default 25)
      tags:
      - Agents (operator)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentGrantListResponse'
          description: Page of grants
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid page or page_size
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found or page out of range
    post:
      operationId: create_agent_recovery_grant
      description: List an agent's enrollment grants, or issue a new or recovery grant
        for it.
      summary: Issue a recovery enrollment grant for an agent's equipment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantForAgentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGrantForAgentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGrantForAgentRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentGrantIssuedResponse'
          description: Grant issued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Enrollment conflict
  /api/agents/{id}/enrollment-grants/{grant_id}/actions/revoke:
    post:
      operationId: revoke_agent_grant
      description: 'Idempotent: revoking a revoked grant returns it unchanged. When
        a pending agent is left with no usable grant it becomes revoked, freeing the
        computer for a new enrollment.'
      summary: Revoke an unredeemed enrollment grant
      parameters:
      - in: path
        name: grant_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentGrantResponse'
          description: Grant revoked
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent or grant not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Grant was already redeemed
components:
  schemas:
    AgentActivityData:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        remote_user:
          type: string
        remote_user_display_name:
          type: string
        remote_computer:
          type: string
        remote_ip:
          type: string
          nullable: true
        booking_code:
          type: string
        offline_at:
          type: string
          format: date-time
          nullable: true
        inactive_at:
          type: string
          format: date-time
          nullable: true
        last_agent_report_at:
          type: string
          format: date-time
          nullable: true
      required:
      - booking_code
      - inactive_at
      - last_agent_report_at
      - offline_at
      - remote_computer
      - remote_ip
      - remote_user
      - remote_user_display_name
      - status
    AgentActivityResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentActivityData'
      required:
      - data
    AgentBookingCheckInData:
      type: object
      properties:
        is_checked_in:
          type: boolean
          description: True when the booking is now in progress for this login.
        booking_code:
          type: string
          description: Present only when checked in.
        starts_at:
          type: string
          format: date-time
          description: Present only when checked in.
        ends_at:
          type: string
          format: date-time
          description: Present only when checked in.
        booked_for:
          type: string
          nullable: true
          description: Username the booking is for; present only when checked in.
      required:
      - is_checked_in
    AgentBookingCheckInResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingCheckInData'
      required:
      - data
    AgentBookingCompleteData:
      type: object
      properties:
        is_completed:
          type: boolean
          description: True when the booking is now completed.
        booking_code:
          type: string
          description: Present only when completed.
        starts_at:
          type: string
          format: date-time
          description: Present only when completed.
        ends_at:
          type: string
          format: date-time
          description: The booked end time, unchanged; present only when completed.
      required:
      - is_completed
    AgentBookingCompleteResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingCompleteData'
      required:
      - data
    AgentBookingExtendData:
      type: object
      properties:
        is_extended:
          type: boolean
          description: True when the booking now ends at ends_at.
        booking_code:
          type: string
          description: Present only when extended.
        starts_at:
          type: string
          format: date-time
          description: Present only when extended.
        ends_at:
          type: string
          format: date-time
          description: The new end; present only when extended.
      required:
      - is_extended
    AgentBookingExtendError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/AgentBookingExtendErrorBody'
      required:
      - error
    AgentBookingExtendErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            anyOf:
            - type: object
              required:
              - field
              - code
              - message
              - limit_at
              properties:
                field:
                  type: string
                code:
                  type: string
                  enum:
                  - already_ended
                  - not_later
                  - too_short
                  - needs_approval
                  - bench_not_in_service
                  - bench_not_free
                message:
                  type: string
                limit_at:
                  type: string
                  format: date-time
                  nullable: true
            - type: object
              required:
              - message
              properties:
                field:
                  type: string
                message:
                  type: string
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    AgentBookingExtendRequest:
      type: object
      properties:
        booking_code:
          type: string
          maxLength: 64
        ends_at:
          type: string
          format: date-time
          description: The new end time. Seconds are dropped.
      required:
      - booking_code
      - ends_at
    AgentBookingExtendResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingExtendData'
      required:
      - data
    AgentBookingValidationData:
      type: object
      properties:
        is_eligible:
          type: boolean
        booking_code:
          type: string
          description: Present only when eligible.
        starts_at:
          type: string
          format: date-time
          description: Present only when eligible.
        ends_at:
          type: string
          format: date-time
          description: Present only when eligible.
        booked_for:
          type: string
          nullable: true
          description: Username the booking is for; present only when eligible.
      required:
      - is_eligible
    AgentBookingValidationRequest:
      type: object
      properties:
        booking_code:
          type: string
          maxLength: 64
      required:
      - booking_code
    AgentBookingValidationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingValidationData'
      required:
      - data
    AgentDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentIdentity'
      required:
      - data
    AgentDeviceObservationsObservationSerializersObservationAcknowledgmentDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/ObservationAcknowledgment'
      required:
      - data
    AgentHeartbeatRequest:
      type: object
      properties:
        agent_uid:
          type: string
          format: uuid
    AgentHeartbeatResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentHeartbeatResponseData'
      required:
      - data
    AgentHeartbeatResponseData:
      type: object
      properties:
        status:
          type: string
        last_seen_at:
          type: string
          format: date-time
      required:
      - last_seen_at
      - status
    AgentIdentity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent_uid:
          type: string
          format: uuid
          readOnly: true
        equipment:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          nullable: true
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        health:
          allOf:
          - $ref: '#/components/schemas/Choice'
          nullable: true
          readOnly: true
          description: 'Liveness of an active agent from last_seen_at: online, delayed
            or offline (also offline before the first heartbeat). Null while pending
            and once revoked or decommissioned; read state then.'
        key_algorithm:
          allOf:
          - $ref: '#/components/schemas/Choice'
          nullable: true
          readOnly: true
        key_storage:
          allOf:
          - $ref: '#/components/schemas/Choice'
          nullable: true
          readOnly: true
        fingerprint:
          type: string
          readOnly: true
        agent_version:
          type: string
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_uid
      - agent_version
      - created_at
      - enrolled_at
      - equipment
      - fingerprint
      - health
      - id
      - key_algorithm
      - key_storage
      - last_seen_at
      - state
      - updated_at
    AgentInfoResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentInfoResponseData'
      required:
      - data
    AgentInfoResponseData:
      type: object
      properties:
        backend_key:
          type: string
          description: Logical name of this department backend (routing-sync backend_id).
        server_time:
          type: string
        capabilities:
          type: array
          items:
            type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
          description: Paths of the agent routes this backend serves, keyed by capability.
      required:
      - backend_key
      - capabilities
      - endpoints
      - server_time
    AgentLicenseCheckReportLicenseCheckSerializersLicenseCheckRunAcknowledgmentDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/LicenseCheckRunAcknowledgment'
      required:
      - data
    AgentLicenseChecks:
      type: object
      properties:
        checks:
          type: array
          items:
            $ref: '#/components/schemas/LicenseCheckDefinition'
      required:
      - checks
    AgentLicenseChecksLicenseCheckSerializersAgentLicenseChecksDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/AgentLicenseChecks'
      required:
      - data
    AgentListMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - pagination
    AgentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentIdentity'
        meta:
          $ref: '#/components/schemas/AgentListMeta'
      required:
      - data
      - meta
    AgentMonitoringPolicyObservationSerializersMonitoringPolicyDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/MonitoringPolicy'
      required:
      - data
    AgentSessionLogData:
      type: object
      properties:
        id:
          type: integer
        event_key:
          type: string
          format: uuid
        login_at:
          type: string
          format: date-time
        logout_at:
          type: string
          format: date-time
        booking_code:
          type: string
          nullable: true
        access_type:
          allOf:
          - $ref: '#/components/schemas/Choice'
          nullable: true
          readOnly: true
      required:
      - access_type
      - booking_code
      - event_key
      - id
      - login_at
      - logout_at
    AgentSessionLogReport:
      type: object
      description: One completed remote session, pushed once after logout. The computer
        is the signing agent's.
      properties:
        event_key:
          type: string
          format: uuid
          description: Agent-generated id of this session; repeat it on retry.
        login_at:
          type: string
          format: date-time
        logout_at:
          type: string
          format: date-time
        active_duration_seconds:
          type: number
          format: double
          minimum: 0
        remote_user:
          type: string
          maxLength: 255
        remote_ip:
          type: string
          nullable: true
        remote_host:
          type: string
          nullable: true
          maxLength: 255
        booking_code:
          type: string
          nullable: true
          description: Empty for a temp login (no booking).
          maxLength: 64
        agent_version:
          type: string
          maxLength: 64
      required:
      - active_duration_seconds
      - event_key
      - login_at
      - logout_at
      - remote_user
    AgentSessionLogResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentSessionLogData'
      required:
      - data
    Choice:
      type: object
      description: ENU-1 ``{value, label}``.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    ComputingActivityStatusEnum:
      enum:
      - offline
      - free
      - active
      - inactive
      - maintaining
      type: string
      description: '* `offline` - Offline

        * `free` - Free

        * `active` - Active

        * `inactive` - Inactive

        * `maintaining` - Maintaining'
    CreateAgentGrantRequest:
      type: object
      properties:
        equipment_uid:
          type: string
          format: uuid
        ttl_minutes:
          type: integer
          maximum: 60
          minimum: 1
          default: 15
      required:
      - equipment_uid
    CreateGrantForAgentRequest:
      type: object
      properties:
        ttl_minutes:
          type: integer
          maximum: 60
          minimum: 1
          default: 15
    DeviceObservation:
      type: object
      properties:
        observation_key:
          type: string
          maxLength: 255
        interface_name:
          type: string
          maxLength: 255
        state:
          $ref: '#/components/schemas/StateEnum'
        name:
          type: string
          default: ''
          maxLength: 255
        serial_number:
          type: string
          default: ''
          description: Evidence only; not used for matching.
          maxLength: 255
        hardware_ids:
          type: array
          items:
            $ref: '#/components/schemas/HardwareId'
          description: IDs read from the device (Windows PnP instance ID); matched
            to registered equipment IDs.
          maxItems: 4
      required:
      - interface_name
      - observation_key
      - state
      additionalProperties: false
    DeviceObservationReport:
      type: object
      properties:
        generation_key:
          type: string
          format: uuid
        collector_key:
          type: string
          maxLength: 32
          pattern: ^[a-z][a-z0-9_-]{0,31}$
        sequence:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          format: int64
        collected_at:
          type: string
          format: date-time
        is_complete:
          type: boolean
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceObservation'
      required:
      - collected_at
      - collector_key
      - devices
      - generation_key
      - is_complete
      - sequence
      additionalProperties: false
    EnrollAgentRequest:
      type: object
      properties:
        grant:
          type: string
        public_key:
          type: string
        key_storage:
          $ref: '#/components/schemas/KeyStorageEnum'
        fingerprint:
          type: string
          default: ''
          maxLength: 128
        agent_version:
          type: string
          maxLength: 64
        proof:
          type: string
      required:
      - agent_version
      - grant
      - key_storage
      - proof
      - public_key
    EnrollmentGrant:
      type: object
      description: Metadata of one enrollment grant; the clear grant is shown only
        once, when issued.
      properties:
        id:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          nullable: true
      required:
      - created_at
      - created_by
      - expires_at
      - id
      - revoked_at
      - status
      - used_at
    EnrollmentGrantIssued:
      type: object
      properties:
        agent_uid:
          type: string
          format: uuid
        equipment_uid:
          type: string
          format: uuid
        grant:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - agent_uid
      - equipment_uid
      - expires_at
      - grant
    EnrollmentGrantIssuedResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EnrollmentGrantIssued'
      required:
      - data
    EnrollmentGrantListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentGrant'
        meta:
          $ref: '#/components/schemas/AgentListMeta'
      required:
      - data
      - meta
    EnrollmentGrantResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EnrollmentGrant'
      required:
      - data
    EquipmentHardwareIdKindEnum:
      enum:
      - pnp_id
      - vector_device
      type: string
      description: '* `pnp_id` - PnP device ID

        * `vector_device` - Vector device name'
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetailItem'
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ErrorDetailItem:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ExpectedDeviceWatch:
      type: object
      properties:
        equipment_uid:
          type: string
          format: uuid
        name:
          type: string
        hardware_ids:
          type: array
          items:
            $ref: '#/components/schemas/PolicyHardwareId'
      required:
      - equipment_uid
      - hardware_ids
      - name
    HardwareId:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/EquipmentHardwareIdKindEnum'
        value:
          type: string
          maxLength: 512
      required:
      - kind
      - value
      additionalProperties: false
    KeyStorageEnum:
      enum:
      - tpm
      - os_keystore
      - software
      type: string
      description: '* `tpm` - TPM

        * `os_keystore` - OS keystore

        * `software` - Software key store'
    LabsNamedReference:
      type: object
      description: Compact `{id, name}` object representation of a related entity.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    LicenseCheckDefinition:
      type: object
      description: One check as the agent parses it (``agent/src/core/licensing/checks.py``).
      properties:
        key:
          type: string
        revision:
          type: integer
        name:
          type: string
        vendor:
          type: string
        interval_minutes:
          type: integer
        probe: {}
        extract: {}
        carrier: {}
      required:
      - carrier
      - extract
      - interval_minutes
      - key
      - name
      - probe
      - revision
      - vendor
    LicenseCheckRunAcknowledgment:
      type: object
      properties:
        idempotency_key:
          type: string
          format: uuid
        sequence:
          type: integer
        result:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        received_at:
          type: string
          format: date-time
      required:
      - idempotency_key
      - received_at
      - result
      - sequence
    LicenseCheckRunReport:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
        sequence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/LicenseCheckRunReportStatusEnum'
        started_at:
          type: string
          format: date-time
        reported_at:
          type: string
          format: date-time
          description: Agent clock; informational.
        duration_ms:
          type: integer
          maximum: 3600000
          minimum: 0
          default: 0
        is_complete:
          type: boolean
        error:
          $ref: '#/components/schemas/RunError'
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/ReportedLicense'
      required:
      - is_complete
      - licenses
      - revision
      - sequence
      - started_at
      - status
      additionalProperties: false
    LicenseCheckRunReportStatusEnum:
      enum:
      - ok
      - not_installed
      - failed
      - rejected
      type: string
      description: '* `ok` - OK: the license list is complete

        * `not_installed` - Tool, file or key not on this computer

        * `failed` - Ran but failed

        * `rejected` - The agent refused the configuration'
    MonitoringPolicy:
      type: object
      properties:
        generation_key:
          type: string
          format: uuid
        max_devices:
          type: integer
        max_body_bytes:
          type: integer
        freshness_seconds:
          type: integer
        interface_names:
          type: array
          items:
            type: string
        expected_devices:
          type: array
          items:
            $ref: '#/components/schemas/ExpectedDeviceWatch'
          description: 'Equipment expected on this computer with their registered
            hardware IDs: the agent reports only devices whose ID is listed here.'
      required:
      - expected_devices
      - freshness_seconds
      - generation_key
      - interface_names
      - max_body_bytes
      - max_devices
    ObservationAcknowledgment:
      type: object
      properties:
        batch_key:
          type: string
          format: uuid
        sequence:
          type: integer
        disposition:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        received_at:
          type: string
          format: date-time
      required:
      - batch_key
      - disposition
      - received_at
      - sequence
    PaginationMeta:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    PatchedAgentActivityReport:
      type: object
      description: Live activity the agent observes on its own computer. Timestamps
        and counters are server-managed.
      properties:
        status:
          $ref: '#/components/schemas/ComputingActivityStatusEnum'
        remote_user:
          type: string
          maxLength: 255
        remote_user_display_name:
          type: string
          maxLength: 255
        remote_computer:
          type: string
          maxLength: 255
        remote_ip:
          type: string
          nullable: true
        booking_code:
          type: string
          maxLength: 255
    PolicyHardwareId:
      type: object
      properties:
        kind:
          type: string
        value:
          type: string
      required:
      - kind
      - value
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    ReportedCarrier:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ReportedCarrierTypeEnum'
        hardware_id:
          $ref: '#/components/schemas/HardwareId'
        equipment_uid:
          type: string
          format: uuid
      required:
      - type
      additionalProperties: false
    ReportedCarrierTypeEnum:
      enum:
      - computer
      - device
      - dongle
      - server
      - equipment
      type: string
      description: '* `computer` - This computer

        * `device` - Hardware mounted to the computer

        * `dongle` - License dongle

        * `server` - License server

        * `equipment` - Unit configured on the check'
    ReportedLicense:
      type: object
      properties:
        observation_key:
          type: string
          maxLength: 255
        vendor:
          type: string
          default: ''
          maxLength: 128
        product_code:
          type: string
          default: ''
          maxLength: 128
        product_name:
          type: string
          maxLength: 255
        license_serial:
          type: string
          default: ''
          description: The tool's license serial or ID; matched to License.serial_number.
            Never a license key.
          maxLength: 128
        carrier:
          $ref: '#/components/schemas/ReportedCarrier'
        expires_at:
          type: string
          format: date-time
          nullable: true
        final_expires_at:
          type: string
          format: date-time
          nullable: true
        max_version:
          type: string
          default: ''
          maxLength: 64
        is_reactivatable:
          type: boolean
          default: false
      required:
      - carrier
      - observation_key
      - product_name
      additionalProperties: false
    RunError:
      type: object
      properties:
        code:
          type: string
          maxLength: 64
        message:
          type: string
          default: ''
          maxLength: 512
      required:
      - code
      additionalProperties: false
    StateEnum:
      enum:
      - connected
      - disconnected
      type: string
      description: '* `connected` - Connected

        * `disconnected` - Disconnected'
    UserReference:
      type: object
      description: 'REL-3 user relation ``{id, username, display_name}``.


        Every user field (owner, creator, actor, auditor, borrower, ...) has this
        one shape, so a client can show the

        display name and still offer the username. ``display_name`` is the display
        name, then the full name, then the

        username. Duck-typed so any feature may use it without importing users.'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - username
  securitySchemes:
    agentSignatureAuth:
      type: apiKey
      in: header
      name: X-Agent-Signature
      description: 'Ed25519 signature (base64url, unpadded) by the enrolled agent
        key over NUL-joined: ''labmango-agent-request-v1'', backend_id, agent_uid,
        HTTP method, path, timestamp, nonce, hex SHA-256 of the raw body. Also required:
        X-Agent-Id (agent_uid), X-Agent-Timestamp (unix seconds, within AGENT_REQUEST_MAX_SKEW_S)
        and X-Agent-Nonce (base64url, at least 16 random bytes, single use).'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    observationSignatureAuth:
      type: apiKey
      in: header
      name: X-Agent-Signature
      description: 'Ed25519 signature (base64url, unpadded) by the enrolled agent
        key over NUL-joined: ''labmango-agent-request-v1'', backend_id, agent_uid,
        HTTP method, path, timestamp, nonce, hex SHA-256 of the raw body. Also required:
        X-Agent-Id (agent_uid), X-Agent-Timestamp (unix seconds, within AGENT_REQUEST_MAX_SKEW_S)
        and X-Agent-Nonce (base64url, at least 16 random bytes, single use).'
servers:
- url: ''
  description: Local Development Server
tags:
- name: Agents
  description: Agents endpoints
- name: Agents (operator)
  description: Agents (operator) endpoints
