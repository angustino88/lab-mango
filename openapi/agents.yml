openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /agent/bookings/actions/check-in:
    post:
      operationId: agent_check_in_booking
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Call
        when the user enters a booking code at login. Eligible only for an approved
        booking on this computer''s bench, from its start until 10 minutes later (reserved)
        or until it ends (in progress). Repeating a check-in is safe. Every failure
        returns checked_in: false with no other fields.'
      summary: Check a user in with a booking code; the booking becomes in progress
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingCheckInResponse'
          description: Check-in result
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field or invalid code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/bookings/actions/validate:
    post:
      operationId: agent_validate_booking
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Does
        not check in or change the booking. Unknown, unapproved, cancelled, finished,
        other-bench and out-of-window codes all return eligible: false with no other
        fields.'
      summary: Check whether a booking code may be used to log in on this computer
        now
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentBookingValidationRequest'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBookingValidationResponse'
          description: Eligibility
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field or invalid code
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/enrollments:
    post:
      operationId: enroll_agent
      description: Redeem an enrollment grant with agent proof (POST /agent/enrollments).
      summary: Redeem one-time grant with agent private key proof
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollAgentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnrollAgentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnrollAgentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent successfully enrolled
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid grant or proof
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Enrollment conflict
  /agent/equipment/activity:
    patch:
      operationId: agent_report_activity
      description: Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and X-Agent-Signature
        headers (see the agentSignatureAuth security scheme). Send only the fields
        that changed.
      summary: Report live activity of the agent's computer
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAgentActivityReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAgentActivityReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAgentActivityReport'
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivityResponse'
          description: Activity recorded
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: The agent's computer was deleted or is no longer computing
            equipment
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field or invalid value
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/heartbeat:
    post:
      operationId: agent_heartbeat
      description: Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and X-Agent-Signature
        headers (see the agentSignatureAuth security scheme). The body may repeat
        agent_uid; if present it must equal X-Agent-Id.
      summary: Record agent heartbeat
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentHeartbeatRequest'
      security:
      - agentSignatureAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHeartbeatResponse'
          description: Heartbeat acknowledged
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /agent/info:
    get:
      operationId: get_agent_info
      description: Discover agent capabilities and backend metadata (GET /agent/info).
      summary: Discover agent API capabilities and server identity
      tags:
      - Agents
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInfoResponse'
          description: Server agent metadata
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Supplied bearer credentials are invalid
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Anonymous or user request rate exceeded
  /agent/session-logs:
    post:
      operationId: agent_record_session_log
      description: 'Requires the X-Agent-Id, X-Agent-Timestamp, X-Agent-Nonce and
        X-Agent-Signature headers (see the agentSignatureAuth security scheme). Send
        once after logout. Repeat the same event_id when retrying: identical values
        return 200 with the stored record. Rejected when logout is more than 5 minutes
        ahead of server time, login is more than 7 days old, or active time exceeds
        the time between login and logout.'
      summary: Record a completed remote session
      tags:
      - Agents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionLogReport'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentSessionLogReport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentSessionLogReport'
        required: true
      security:
      - agentSignatureAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionLogResponse'
          description: Session stored
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionLogResponse'
          description: Same event already stored; no change
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Body is not a JSON object
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid, stale or replayed signature, or agent not
            active
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Event id stored with different values, or the agent's computer
            is deleted
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unknown field, invalid value or limit exceeded
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Request rate exceeded
  /api/agents:
    get:
      operationId: list_agents
      description: List agent identities or issue an initial enrollment grant.
      summary: List enrolled and pending agents
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (>= 1)
      - in: query
        name: page_size
        schema:
          type: integer
        description: Page size (1..100, default 25)
      tags:
      - Agents (operator)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
          description: Page of agents
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid page or page_size
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Page out of range
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
    post:
      operationId: create_agent_grant
      description: List agent identities or issue an initial enrollment grant.
      summary: Issue a one-time enrollment grant for computing equipment
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentGrantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAgentGrantRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAgentGrantRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentGrantIssuedResponse'
          description: Enrollment grant issued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Computing equipment not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Equipment already has pending or active agent
  /api/agents/{id}:
    get:
      operationId: get_agent_detail
      description: Retrieve detail of an enrolled agent.
      summary: Retrieve agent identity detail
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent detail
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
  /api/agents/{id}/actions/decommission:
    post:
      operationId: decommission_agent
      description: Decommission an active agent identity.
      summary: Decommission an agent identity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent decommissioned
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
  /api/agents/{id}/actions/revoke:
    post:
      operationId: revoke_agent
      description: Revoke an active agent identity.
      summary: Revoke an agent identity
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema: {}
          application/x-www-form-urlencoded:
            schema: {}
          multipart/form-data:
            schema: {}
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
          description: Agent revoked
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
  /api/agents/{id}/enrollment-grants:
    post:
      operationId: create_agent_recovery_grant
      description: Issue a new or recovery enrollment grant for an existing agent.
      summary: Issue a recovery enrollment grant for an agent's equipment
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Agents (operator)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrantForAgentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateGrantForAgentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateGrantForAgentRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentGrantIssuedResponse'
          description: Grant issued
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Caller is not a lab coordinator or admin
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Agent not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Enrollment conflict
components:
  schemas:
    AccessTypeEnum:
      enum:
      - booked
      - ad_hoc
      - unverified_booking
      type: string
      description: '* `booked` - Booked

        * `ad_hoc` - Ad hoc (no booking)

        * `unverified_booking` - Booking not verified'
    AgentActivityData:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ComputingActivityStatusEnum'
        remote_user:
          type: string
        remote_user_display_name:
          type: string
        remote_computer:
          type: string
        remote_ip:
          type: string
          nullable: true
        booking_code:
          type: string
        offline_at:
          type: string
          format: date-time
          nullable: true
        inactive_at:
          type: string
          format: date-time
          nullable: true
        last_agent_report_at:
          type: string
          format: date-time
          nullable: true
      required:
      - booking_code
      - inactive_at
      - last_agent_report_at
      - offline_at
      - remote_computer
      - remote_ip
      - remote_user
      - remote_user_display_name
      - status
    AgentActivityResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentActivityData'
      required:
      - data
    AgentBookingCheckInData:
      type: object
      properties:
        checked_in:
          type: boolean
          description: True when the booking is now in progress for this login.
        booking_code:
          type: string
          description: Present only when checked in.
        starts_at:
          type: string
          format: date-time
          description: Present only when checked in.
        ends_at:
          type: string
          format: date-time
          description: Present only when checked in.
        booked_for:
          type: string
          nullable: true
          description: Username the booking is for; present only when checked in.
      required:
      - checked_in
    AgentBookingCheckInResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingCheckInData'
      required:
      - data
    AgentBookingValidationData:
      type: object
      properties:
        eligible:
          type: boolean
        booking_code:
          type: string
          description: Present only when eligible.
        starts_at:
          type: string
          format: date-time
          description: Present only when eligible.
        ends_at:
          type: string
          format: date-time
          description: Present only when eligible.
        booked_for:
          type: string
          nullable: true
          description: Username the booking is for; present only when eligible.
      required:
      - eligible
    AgentBookingValidationRequest:
      type: object
      properties:
        booking_code:
          type: string
          maxLength: 64
      required:
      - booking_code
    AgentBookingValidationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingValidationData'
      required:
      - data
    AgentDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentIdentity'
      required:
      - data
    AgentHeartbeatRequest:
      type: object
      properties:
        agent_uid:
          type: string
          format: uuid
    AgentHeartbeatResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentHeartbeatResponseData'
      required:
      - data
    AgentHeartbeatResponseData:
      type: object
      properties:
        status:
          type: string
        last_seen_at:
          type: string
          format: date-time
      required:
      - last_seen_at
      - status
    AgentIdentity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent_uid:
          type: string
          format: uuid
          readOnly: true
        equipment:
          type: integer
          readOnly: true
        equipment_sku:
          type: string
          readOnly: true
        equipment_name:
          type: string
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        key_algorithm:
          allOf:
          - $ref: '#/components/schemas/KeyAlgorithmEnum'
          readOnly: true
        key_storage:
          allOf:
          - $ref: '#/components/schemas/KeyStorageEnum'
          readOnly: true
        fingerprint:
          type: string
          readOnly: true
        agent_version:
          type: string
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_uid
      - agent_version
      - created
      - enrolled_at
      - equipment
      - equipment_name
      - equipment_sku
      - fingerprint
      - id
      - key_algorithm
      - key_storage
      - last_seen_at
      - modified
      - state
    AgentInfoResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentInfoResponseData'
      required:
      - data
    AgentInfoResponseData:
      type: object
      properties:
        backend_id:
          type: string
        server_time:
          type: string
        capabilities:
          type: array
          items:
            type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
          description: Paths of the agent routes this backend serves, keyed by capability.
      required:
      - backend_id
      - capabilities
      - endpoints
      - server_time
    AgentListMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - pagination
    AgentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentIdentity'
        meta:
          $ref: '#/components/schemas/AgentListMeta'
      required:
      - data
      - meta
    AgentSessionLogData:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: string
          format: uuid
        login_time:
          type: string
          format: date-time
        logout_time:
          type: string
          format: date-time
        booking_code:
          type: string
          nullable: true
        access_type:
          nullable: true
          description: 'booked: a verified booking for this computer''s bench; ad_hoc:
            no booking code; unverified_booking: a code that did not verify. Null
            only for sessions stored before access types existed.


            * `booked` - Booked

            * `ad_hoc` - Ad hoc (no booking)

            * `unverified_booking` - Booking not verified'
          oneOf:
          - $ref: '#/components/schemas/AccessTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - access_type
      - booking_code
      - event_id
      - id
      - login_time
      - logout_time
    AgentSessionLogReport:
      type: object
      description: One completed remote session, pushed once after logout. The computer
        is the signing agent's.
      properties:
        event_id:
          type: string
          format: uuid
          description: Agent-generated id of this session; repeat it on retry.
        login_time:
          type: string
          format: date-time
        logout_time:
          type: string
          format: date-time
        active_duration_seconds:
          type: number
          format: double
          minimum: 0
        remote_user:
          type: string
          maxLength: 255
        remote_ip:
          type: string
          nullable: true
        remote_host:
          type: string
          nullable: true
          maxLength: 255
        booking_code:
          type: string
          nullable: true
          description: Empty for a temp login (no booking).
          maxLength: 64
        agent_version:
          type: string
          maxLength: 64
      required:
      - active_duration_seconds
      - event_id
      - login_time
      - logout_time
      - remote_user
    AgentSessionLogResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentSessionLogData'
      required:
      - data
    ComputingActivityStatusEnum:
      enum:
      - offline
      - free
      - active
      - inactive
      - maintaining
      type: string
      description: '* `offline` - Offline

        * `free` - Free

        * `active` - Active

        * `inactive` - Inactive

        * `maintaining` - Maintaining'
    CreateAgentGrantRequest:
      type: object
      properties:
        equipment_uid:
          type: string
          format: uuid
        ttl_minutes:
          type: integer
          maximum: 60
          minimum: 1
          default: 15
      required:
      - equipment_uid
    CreateGrantForAgentRequest:
      type: object
      properties:
        ttl_minutes:
          type: integer
          maximum: 60
          minimum: 1
          default: 15
    EnrollAgentRequest:
      type: object
      properties:
        grant:
          type: string
        public_key:
          type: string
        key_storage:
          $ref: '#/components/schemas/KeyStorageEnum'
        fingerprint:
          type: string
          default: ''
          maxLength: 128
        agent_version:
          type: string
          maxLength: 64
        proof:
          type: string
      required:
      - agent_version
      - grant
      - key_storage
      - proof
      - public_key
    EnrollmentGrantIssued:
      type: object
      properties:
        agent_uid:
          type: string
          format: uuid
        equipment_uid:
          type: string
          format: uuid
        grant:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - agent_uid
      - equipment_uid
      - expires_at
      - grant
    EnrollmentGrantIssuedResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EnrollmentGrantIssued'
      required:
      - data
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetailItem'
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ErrorDetailItem:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - message
    ErrorEnvelope:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    KeyAlgorithmEnum:
      enum:
      - Ed25519
      type: string
      description: '* `Ed25519` - Ed25519'
    KeyStorageEnum:
      enum:
      - tpm
      - os_keystore
      - software
      type: string
      description: '* `tpm` - TPM

        * `os_keystore` - OS keystore

        * `software` - Software key store'
    NullEnum:
      enum:
      - null
    PaginationMeta:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    PatchedAgentActivityReport:
      type: object
      description: Live activity the agent observes on its own computer. Timestamps
        and counters are server-managed.
      properties:
        status:
          $ref: '#/components/schemas/ComputingActivityStatusEnum'
        remote_user:
          type: string
          maxLength: 255
        remote_user_display_name:
          type: string
          maxLength: 255
        remote_computer:
          type: string
          maxLength: 255
        remote_ip:
          type: string
          nullable: true
        booking_code:
          type: string
          maxLength: 255
    StateEnum:
      enum:
      - pending
      - active
      - revoked
      - decommissioned
      type: string
      description: '* `pending` - Pending

        * `active` - Active

        * `revoked` - Revoked

        * `decommissioned` - Decommissioned'
  securitySchemes:
    agentSignatureAuth:
      type: apiKey
      in: header
      name: X-Agent-Signature
      description: 'Ed25519 signature (base64url, unpadded) by the enrolled agent
        key over NUL-joined: ''labmango-agent-request-v1'', backend_id, agent_uid,
        HTTP method, path, timestamp, nonce, hex SHA-256 of the raw body. Also required:
        X-Agent-Id (agent_uid), X-Agent-Timestamp (unix seconds, within AGENT_REQUEST_MAX_SKEW_S)
        and X-Agent-Nonce (base64url, at least 16 random bytes, single use).'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Agents
  description: Agents endpoints
- name: Agents (operator)
  description: Agents (operator) endpoints
