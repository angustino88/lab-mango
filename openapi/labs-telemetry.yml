  /api/labs/telemetry/devices:
    get:
      operationId: labs_telemetry_devices_retrieve
      description: HTTP mapping for domain commands and selector projections.
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - room_host
          - station_pc
          - equipment_agent
          - modbus_tcp
          type: string
          minLength: 1
        description: '* `room_host` - Room gateway

          * `station_pc` - Station gateway

          * `equipment_agent` - Equipment self-reporting agent

          * `modbus_tcp` - Modbus TCP endpoint'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
        description: 'Free-text search: UID, model, asset, IP address.'
      - in: query
        name: role
        schema:
          enum:
          - gateway
          - source
          type: string
          minLength: 1
        description: '* `gateway` - Gateway

          * `source` - Source'
      - in: query
        name: room_id
        schema:
          type: integer
          minimum: 1
        description: Installed in, or covering, this room.
      - in: query
        name: state
        schema:
          enum:
          - discovered
          - claimed
          - retired
          type: string
          minLength: 1
        description: '* `discovered` - Discovered

          * `claimed` - Claimed

          * `retired` - Retired'
      tags:
      - Telemetry
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
