    UserReference:
      type: object
      description: 'REL-3 user relation ``{id, username, display_name}``.


        Every user field (owner, creator, actor, auditor, borrower, ...) has this
        one shape, so a client can show the

        display name and still offer the username. ``display_name`` is the display
        name, then the full name, then the

        username. Duck-typed so any feature may use it without importing users.'
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
      - username
