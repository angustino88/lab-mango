openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/resources/lookup:
    get:
      operationId: labs_resources_lookup_retrieve
      description: 'Lab operators only: it reads rooms, stations, benches, equipment
        and licenses.'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 10
          minimum: 1
          default: 5
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Name, UID or SKU.
        required: true
      - in: query
        name: types
        schema:
          type: string
          minLength: 1
        description: 'Comma-separated: room, station, bench, equipment, license. Default:
          every type you may read.'
      tags:
      - Resource Lookup
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLookupSerializersResourceLookupMatchListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Resources Lookup
components:
  schemas:
    LabsChoiceReference:
      type: object
      description: Standard `{value, label}` representation for enum and lifecycle
        choices.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    LabsUIDNamedReference:
      type: object
      description: Compact `{id, uid, name}` object representation when target defines
        a UUID.
      properties:
        id:
          type: integer
          readOnly: true
        uid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - uid
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    ResourceLookupMatch:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
          description: room, station, bench, equipment or license.
        match:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
          description: 'How q matched, best first: uid_exact, sku_exact, name_exact,
            prefix, contains.'
        resource:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
        sku:
          type: string
          readOnly: true
        context:
          type: string
          readOnly: true
          description: Where it is, or its product; empty when unknown.
      required:
      - context
      - match
      - resource
      - sku
      - type
    ResourceLookupSerializersResourceLookupMatchListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceLookupMatch'
      required:
      - data
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Resource Lookup
  description: Resource Lookup endpoints
