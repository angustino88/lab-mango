    EquipmentUpdate:
      type: object
      description: Validate related references before model save, including partial
        updates.
      properties:
        sku:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        serial_number:
          type: string
          maxLength: 255
        log_label:
          type: string
          title: Previous / legacy label
          description: Label that already existed on the asset before it was registered.
          maxLength: 255
        details:
          type: string
        metadata: {}
        replacement_date:
          type: string
          format: date
          nullable: true
          description: Planned date when the equipment should be replaced.
        firmware_version:
          type: string
          description: Firmware currently installed on this unit.
          maxLength: 255
        power_draw_w:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Nameplate power consumption in watts.
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        warranty_until:
          type: string
          format: date
          nullable: true
        calibration_required:
          type: boolean
          description: History and due dates are kept as ResourceServiceRecord (kind=calibration).
        mac_address:
          oneOf:
          - type: string
            pattern: ^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$
            maxLength: 17
          - type: string
            maxLength: 0
        channels:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: Output channels (power).
        power_rating:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Output capacity in watts (power).
        dimensions:
          description: Keys length_mm, width_mm, height_mm (mechanical, furniture).
        computing:
          $ref: '#/components/schemas/EquipmentComputingProfileUpdate'
        kind_id:
          type: integer
        type_id:
          type: integer
          nullable: true
        manufacturer_id:
          type: integer
          nullable: true
        product_model_id:
          type: integer
          nullable: true
        owner_id:
          type: integer
          nullable: true
        department_id:
          type: integer
          nullable: true
          description: Owning department.
        group_id:
          type: integer
          nullable: true
          description: Owning team; must belong to the selected department.
        material_id:
          type: integer
          nullable: true
        size_id:
          type: integer
          nullable: true
        resolution_id:
          type: integer
          nullable: true
        protocol_id:
          type: integer
          nullable: true
        customer_id:
          type: integer
          nullable: true
        interfaces_ids:
          type: array
          items:
            type: integer
        characteristics_ids:
          type: array
          items:
            type: integer
      required:
      - kind_id
      - sku
