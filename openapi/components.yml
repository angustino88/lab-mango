components:
  schemas:
    AADLogin:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
          maxLength: 16384
        nonce_secret:
          type: string
          writeOnly: true
          description: The browser's random secret; the ID token's nonce is base64url(SHA-256(nonce_secret)).
          maxLength: 128
          minLength: 43
      required:
      - id_token
      - nonce_secret
    AADLoginResponse:
      type: object
      properties:
        username:
          type: string
        access:
          type: string
        is_active:
          type: boolean
        csrf_token:
          type: string
      required:
      - access
      - is_active
      - username
    AADLoginSerializerAADLoginResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/AADLoginResponse'
      required:
      - data
    AccessPolicyEnum:
      enum:
      - open
      - restricted
      type: string
      description: '* `open` - Open

        * `restricted` - Restricted'
    AccessTypeEnum:
      enum:
      - booked
      - ad_hoc
      - unverified_booking
      type: string
      description: '* `booked` - Booked

        * `ad_hoc` - Ad hoc (no booking)

        * `unverified_booking` - Booking not verified'
    ActionEnum:
      enum:
      - heartbeat
      - device_inserted
      - device_removed
      - device_changed
      - device_status_changed
      - inventory_snapshot
      - metric_reported
      - alert_raised
      - alert_resolved
      - custom
      type: string
      description: '* `heartbeat` - Heartbeat

        * `device_inserted` - Device inserted

        * `device_removed` - Device removed

        * `device_changed` - Device changed

        * `device_status_changed` - Device status changed

        * `inventory_snapshot` - Inventory snapshot

        * `metric_reported` - Metric reported

        * `alert_raised` - Alert raised

        * `alert_resolved` - Alert resolved

        * `custom` - Custom'
    ActiveBenchesMetric:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    AdminCannedResponseCreate:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        body:
          type: string
        team_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
          default: true
      required:
      - body
      - title
    AdminCannedResponseCreateSerializersCannedResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/CannedResponse'
      required:
      - data
    AdminCannedResponseListSerializersCannedResponseListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CannedResponse'
      required:
      - data
    AdminCannedResponseUpdateSerializersCannedResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/CannedResponse'
      required:
      - data
    AdminCategoryCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        code:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]*$
            maxLength: 50
            default: ''
          - type: string
            maxLength: 0
        default_team_id:
          type: integer
          nullable: true
        description:
          type: string
          default: ''
        sort_order:
          type: integer
          default: 0
        is_active:
          type: boolean
          default: true
      required:
      - name
    AdminCategoryCreateSerializersCategoryDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Category'
      required:
      - data
    AdminCategoryListSerializersCategoryListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - data
    AdminCategoryUpdateSerializersCategoryDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Category'
      required:
      - data
    AdminLabelCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        color_hex:
          oneOf:
          - type: string
            default: ''
            pattern: ^(#[0-9A-Fa-f]{6})?$
          - type: string
            maxLength: 0
      required:
      - name
    AdminLabelCreateSerializersLabelDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Label'
      required:
      - data
    AdminLabelListSerializersLabelListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Label'
      required:
      - data
    AdminLabelUpdateSerializersLabelDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Label'
      required:
      - data
    AdminPriorityCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        rank:
          type: integer
          minimum: 1
        code:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]*$
            maxLength: 50
            default: ''
          - type: string
            maxLength: 0
        color_hex:
          oneOf:
          - type: string
            default: ''
            pattern: ^(#[0-9A-Fa-f]{6})?$
          - type: string
            maxLength: 0
        response_target_minutes:
          type: integer
          minimum: 1
          nullable: true
        resolution_target_minutes:
          type: integer
          minimum: 1
          nullable: true
        is_default:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
      required:
      - name
      - rank
    AdminPriorityCreateSerializersPriorityDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Priority'
      required:
      - data
    AdminPriorityListSerializersPriorityListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Priority'
      required:
      - data
    AdminPriorityUpdateSerializersPriorityDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Priority'
      required:
      - data
    AdminSettingsDetailSerializersSupportSettingsDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/SupportSettings'
      required:
      - data
    AdminSettingsUpdateSerializersSupportSettingsDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/SupportSettings'
      required:
      - data
    AdminStatusCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        color_hex:
          oneOf:
          - type: string
            default: ''
            pattern: ^(#[0-9A-Fa-f]{6})?$
          - type: string
            maxLength: 0
        is_final:
          type: boolean
          default: false
        pauses_sla:
          type: boolean
          default: false
        system_state:
          $ref: '#/components/schemas/SystemStateEnum'
        is_initial:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        sort_order:
          type: integer
          default: 0
      required:
      - name
      - system_state
    AdminStatusCreateSerializersStatusDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Status'
      required:
      - data
    AdminStatusListSerializersStatusListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Status'
      required:
      - data
    AdminStatusUpdateSerializersStatusDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Status'
      required:
      - data
    AdminTeamCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        code:
          oneOf:
          - type: string
            pattern: ^[-a-zA-Z0-9_]*$
            maxLength: 50
            default: ''
          - type: string
            maxLength: 0
        description:
          type: string
          default: ''
        lead_id:
          type: integer
          nullable: true
        member_ids:
          type: array
          items:
            type: integer
        is_active:
          type: boolean
          default: true
      required:
      - name
    AdminTeamCreateSerializersTeamDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Team'
      required:
      - data
    AdminTeamListSerializersTeamListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Team'
      required:
      - data
    AdminTeamUpdateSerializersTeamDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Team'
      required:
      - data
    AdminTransitionCreate:
      type: object
      properties:
        from_status_id:
          type: integer
        to_status_id:
          type: integer
        allowed_roles:
          type: array
          items:
            type: string
        requires_reason:
          type: boolean
          default: false
        requires_resolution:
          type: boolean
          default: false
      required:
      - from_status_id
      - to_status_id
    AdminTransitionCreateSerializersStatusTransitionDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/StatusTransition'
      required:
      - data
    AdminTransitionListSerializersStatusTransitionListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatusTransition'
      required:
      - data
    AdminTransitionUpdateSerializersStatusTransitionDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/StatusTransition'
      required:
      - data
    AgentActivityData:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ComputingActivityStatusEnum'
        remote_user:
          type: string
        remote_user_display_name:
          type: string
        remote_computer:
          type: string
        remote_ip:
          type: string
          nullable: true
        booking_code:
          type: string
        offline_at:
          type: string
          format: date-time
          nullable: true
        inactive_at:
          type: string
          format: date-time
          nullable: true
        last_agent_report_at:
          type: string
          format: date-time
          nullable: true
      required:
      - booking_code
      - inactive_at
      - last_agent_report_at
      - offline_at
      - remote_computer
      - remote_ip
      - remote_user
      - remote_user_display_name
      - status
    AgentActivityResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentActivityData'
      required:
      - data
    AgentBookingCheckInData:
      type: object
      properties:
        checked_in:
          type: boolean
          description: True when the booking is now in progress for this login.
        booking_code:
          type: string
          description: Present only when checked in.
        starts_at:
          type: string
          format: date-time
          description: Present only when checked in.
        ends_at:
          type: string
          format: date-time
          description: Present only when checked in.
        booked_for:
          type: string
          nullable: true
          description: Username the booking is for; present only when checked in.
      required:
      - checked_in
    AgentBookingCheckInResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingCheckInData'
      required:
      - data
    AgentBookingCompleteData:
      type: object
      properties:
        completed:
          type: boolean
          description: True when the booking is now completed.
        booking_code:
          type: string
          description: Present only when completed.
        starts_at:
          type: string
          format: date-time
          description: Present only when completed.
        ends_at:
          type: string
          format: date-time
          description: The booked end time, unchanged; present only when completed.
      required:
      - completed
    AgentBookingCompleteResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingCompleteData'
      required:
      - data
    AgentBookingExtendData:
      type: object
      properties:
        extended:
          type: boolean
          description: True when the booking now ends at ends_at.
        booking_code:
          type: string
          description: Present only when extended.
        starts_at:
          type: string
          format: date-time
          description: Present only when extended.
        ends_at:
          type: string
          format: date-time
          description: The new end; present only when extended.
      required:
      - extended
    AgentBookingExtendError:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/AgentBookingExtendErrorBody'
      required:
      - error
    AgentBookingExtendErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/AgentBookingExtendErrorDetail'
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    AgentBookingExtendErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: Always ends_at.
        code:
          allOf:
          - $ref: '#/components/schemas/CodeEnum'
          description: 'Why the extension was refused (stable).


            * `already_ended` - already_ended

            * `not_later` - not_later

            * `too_short` - too_short

            * `needs_approval` - needs_approval

            * `bench_not_in_service` - bench_not_in_service

            * `bench_not_free` - bench_not_free'
        message:
          type: string
        limit:
          type: string
          format: date-time
          nullable: true
          description: 'too_short: earliest accepted end; needs_approval: latest accepted
            end; bench_not_free: when the next booking starts; otherwise null.'
      required:
      - code
      - field
      - limit
      - message
    AgentBookingExtendRequest:
      type: object
      properties:
        booking_code:
          type: string
          maxLength: 64
        ends_at:
          type: string
          format: date-time
          description: The new end time. Seconds are dropped.
      required:
      - booking_code
      - ends_at
    AgentBookingExtendResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingExtendData'
      required:
      - data
    AgentBookingValidationData:
      type: object
      properties:
        eligible:
          type: boolean
        booking_code:
          type: string
          description: Present only when eligible.
        starts_at:
          type: string
          format: date-time
          description: Present only when eligible.
        ends_at:
          type: string
          format: date-time
          description: Present only when eligible.
        booked_for:
          type: string
          nullable: true
          description: Username the booking is for; present only when eligible.
      required:
      - eligible
    AgentBookingValidationRequest:
      type: object
      properties:
        booking_code:
          type: string
          maxLength: 64
      required:
      - booking_code
    AgentBookingValidationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentBookingValidationData'
      required:
      - data
    AgentDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentIdentity'
      required:
      - data
    AgentHeartbeatRequest:
      type: object
      properties:
        agent_uid:
          type: string
          format: uuid
    AgentHeartbeatResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentHeartbeatResponseData'
      required:
      - data
    AgentHeartbeatResponseData:
      type: object
      properties:
        status:
          type: string
        last_seen_at:
          type: string
          format: date-time
      required:
      - last_seen_at
      - status
    AgentIdentity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        agent_uid:
          type: string
          format: uuid
          readOnly: true
        equipment:
          type: integer
          readOnly: true
        equipment_sku:
          type: string
          readOnly: true
        equipment_name:
          type: string
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        key_algorithm:
          allOf:
          - $ref: '#/components/schemas/KeyAlgorithmEnum'
          readOnly: true
        key_storage:
          allOf:
          - $ref: '#/components/schemas/KeyStorageEnum'
          readOnly: true
        fingerprint:
          type: string
          readOnly: true
        agent_version:
          type: string
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        enrolled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
      required:
      - agent_uid
      - agent_version
      - created
      - enrolled_at
      - equipment
      - equipment_name
      - equipment_sku
      - fingerprint
      - id
      - key_algorithm
      - key_storage
      - last_seen_at
      - modified
      - state
    AgentInfoResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentInfoResponseData'
      required:
      - data
    AgentInfoResponseData:
      type: object
      properties:
        backend_id:
          type: string
        server_time:
          type: string
        capabilities:
          type: array
          items:
            type: string
        endpoints:
          type: object
          additionalProperties:
            type: string
          description: Paths of the agent routes this backend serves, keyed by capability.
      required:
      - backend_id
      - capabilities
      - endpoints
      - server_time
    AgentListMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
      required:
      - pagination
    AgentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentIdentity'
        meta:
          $ref: '#/components/schemas/AgentListMeta'
      required:
      - data
      - meta
    AgentSessionLogData:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: string
          format: uuid
        login_time:
          type: string
          format: date-time
        logout_time:
          type: string
          format: date-time
        booking_code:
          type: string
          nullable: true
        access_type:
          nullable: true
          description: 'booked: a verified booking for this computer''s bench; ad_hoc:
            no booking code; unverified_booking: a code that did not verify. Null
            only for sessions stored before access types existed.


            * `booked` - Booked

            * `ad_hoc` - Ad hoc (no booking)

            * `unverified_booking` - Booking not verified'
          oneOf:
          - $ref: '#/components/schemas/AccessTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - access_type
      - booking_code
      - event_id
      - id
      - login_time
      - logout_time
    AgentSessionLogReport:
      type: object
      description: One completed remote session, pushed once after logout. The computer
        is the signing agent's.
      properties:
        event_id:
          type: string
          format: uuid
          description: Agent-generated id of this session; repeat it on retry.
        login_time:
          type: string
          format: date-time
        logout_time:
          type: string
          format: date-time
        active_duration_seconds:
          type: number
          format: double
          minimum: 0
        remote_user:
          type: string
          maxLength: 255
        remote_ip:
          type: string
          nullable: true
        remote_host:
          type: string
          nullable: true
          maxLength: 255
        booking_code:
          type: string
          nullable: true
          description: Empty for a temp login (no booking).
          maxLength: 64
        agent_version:
          type: string
          maxLength: 64
      required:
      - active_duration_seconds
      - event_id
      - login_time
      - logout_time
      - remote_user
    AgentSessionLogResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AgentSessionLogData'
      required:
      - data
    AllResourceAuditListSerializersResourceAuditItemPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/AllResourceAuditListSerializersResourceAuditItemPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAuditItem'
      required:
      - data
      - meta
    AllResourceAuditListSerializersResourceAuditItemPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    AllResourceAuditListSerializersResourceAuditItemPaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/AllResourceAuditListSerializersResourceAuditItemPagination'
      required:
      - pagination
    AnalyticsAggregatedLog:
      type: object
      description: Bucket-aggregated historical metrics row.
      properties:
        date:
          type: string
        year:
          type: integer
        week:
          type: integer
        month:
          type: integer
        quarter:
          type: integer
        count:
          type: integer
      required:
      - count
    AnalyticsCountTrend:
      type: object
      description: Aggregate count and week-over-week trend.
      properties:
        count:
          type: integer
        trend:
          type: number
          format: double
      required:
      - count
      - trend
    AttachmentUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: uri
        comment_id:
          type: integer
          nullable: true
        is_restricted:
          type: boolean
          default: false
      required:
      - file
    AuditCatalogItem:
      type: object
      description: One auditable resource as the audit tool stores it offline. Never
        carries license keys.
      properties:
        uid:
          type: string
          format: uuid
        resource_type:
          $ref: '#/components/schemas/AuditCatalogItemResourceTypeEnum'
        sku:
          type: string
        name:
          type: string
        serial_number:
          type: string
          description: Equipment only; empty for other types.
        status:
          type: string
          description: Equipment lifecycle_state; bench, station or room lifecycle_status;
            or the newest status record of a license; empty when none exists.
        condition:
          type: string
          description: Computed from downtime (operational, in_maintenance, out_of_service);
            empty for licenses.
        location:
          type: string
          description: 'Bench: setup station name. Station: room name. Room: building
            name. Otherwise empty.'
        expiry_date:
          type: string
          format: date-time
          nullable: true
          description: License expiry; null for other types.
        updated_at:
          type: string
          format: date-time
        deleted:
          type: boolean
          description: True when the resource was deleted; remove it from the local
            copy.
      required:
      - condition
      - deleted
      - expiry_date
      - location
      - name
      - resource_type
      - serial_number
      - sku
      - status
      - uid
      - updated_at
    AuditCatalogItemResourceTypeEnum:
      enum:
      - equipment
      - bench
      - station
      - room
      - license
      type: string
      description: '* `equipment` - equipment

