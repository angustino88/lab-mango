  securitySchemes:
    agentSignatureAuth:
      type: apiKey
      in: header
      name: X-Agent-Signature
      description: 'Ed25519 signature (base64url, unpadded) by the enrolled agent
        key over NUL-joined: ''labmango-agent-request-v1'', backend_id, agent_uid,
        HTTP method, path, timestamp, nonce, hex SHA-256 of the raw body. Also required:
        X-Agent-Id (agent_uid), X-Agent-Timestamp (unix seconds, within AGENT_REQUEST_MAX_SKEW_S)
        and X-Agent-Nonce (base64url, at least 16 random bytes, single use).'
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    entraAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Microsoft Entra delegated access token for the Lab Mango API scope
        (api://<client-id>/LabMango.Audit), used by the desktop audit tool.
    entraAccessTokenRead:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Microsoft Entra delegated access token for the Lab Mango API scope
        (api://<client-id>/LabMango.Audit). Accepted for GET only; writes need a Lab
        Mango JWT.
    equipmentFacetsApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use Authorization: Api-Key <key>.'
    financeApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use Authorization: Api-Key <key>.'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    routingSyncBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
