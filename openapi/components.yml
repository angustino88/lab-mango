      properties:
        window_days:
          type: integer
          description: Window in days used for recent throughput metrics.
        open_total:
          type: integer
          description: Total number of active, non-done tickets.
        unassigned:
          type: integer
          description: Total number of tickets without an assignee.
        mine_open:
          type: integer
          description: Total number of open tickets assigned to the calling agent.
        by_state:
          type: object
          additionalProperties:
            type: integer
          description: Ticket count grouped by system state.
        by_type:
          type: object
          additionalProperties:
            type: integer
          description: Open ticket count grouped by ticket type.
        by_priority:
          type: array
          items:
            $ref: '#/components/schemas/QueueStatsPriorityItem'
          description: Breakdown of open tickets by priority.
        by_team:
          type: array
          items:
            $ref: '#/components/schemas/QueueStatsTeamItem'
          description: Breakdown of open tickets by team.
        by_assignee:
          type: array
          items:
            $ref: '#/components/schemas/QueueStatsAssigneeItem'
          description: Breakdown of open tickets by assignee (top 20).
        sla:
          allOf:
          - $ref: '#/components/schemas/QueueStatsSla'
          description: Current SLA breach and pause counters.
        created:
          type: integer
          description: Total tickets created within the window.
        resolved:
          type: integer
          description: Total tickets resolved within the window.
        reopened:
          type: integer
          description: Total tickets reopened within the window.
        avg_first_response_minutes:
          type: number
          format: double
          nullable: true
          description: Average first response time in minutes.
        avg_resolution_minutes:
          type: number
          format: double
          nullable: true
          description: Average resolution time in minutes.
        csat_average:
          type: number
          format: double
          nullable: true
          description: Average CSAT rating within the window (1.0 to 5.0).
        csat_responses:
          type: integer
          description: Number of CSAT ratings submitted within the window.
      required:
      - avg_first_response_minutes
      - avg_resolution_minutes
      - by_assignee
      - by_priority
      - by_state
      - by_team
      - by_type
      - created
      - csat_average
      - csat_responses
      - mine_open
      - open_total
      - reopened
      - resolved
      - sla
      - unassigned
      - window_days
