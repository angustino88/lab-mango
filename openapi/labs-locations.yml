  /api/labs/locations/reference-data/buildings:
    get:
      operationId: labs_locations_reference_data_buildings_retrieve
      description: List Building reference records in a paginated data envelope. Validates
        the declared search, relation and pagination query parameters and delegates
        filtering and access checks to the owner-provided listing callback.
      parameters:
      - in: query
        name: city_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
          minLength: 1
      tags:
      - Locations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingReferenceListSerializersBuildingCatalogRecordPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Locations Reference Data Buildings
    post:
      operationId: labs_locations_reference_data_buildings_create
      description: 'Create a Building reference record from the declared writable
        fields. Passes the validated values, authenticated user and Idempotency-Key
        to the owner-provided create callback. Returns a 201 data envelope with Location;
        a replay reported by the callback also includes Idempotency-Replayed: true.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Required replay key (max 128 characters); receipts retained until
          explicitly purged.
        required: true
      tags:
      - Locations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingCatalogCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BuildingCatalogCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BuildingCatalogCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingReferenceCreateSerializersBuildingCatalogRecordDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
