openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/buildings:
    get:
      operationId: labs_buildings_retrieve
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: query
        name: city_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: include_ids
        schema:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 50
          uniqueItems: true
        description: Comma-separated positive integers (at most 50) of retired rows
          to include.
        style: form
        explode: false
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Search text (1 to 100 characters).
      tags:
      - Locations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingCatalogListGeoSerializersBuildingPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Buildings
  /api/labs/buildings/{building_id}:
    get:
      operationId: labs_buildings_retrieve_by_building_id
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: path
        name: building_id
        schema:
          type: integer
        required: true
      tags:
      - Locations
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingCatalogDetailGeoSerializersBuildingDetailResponse'
          description: ''
        '404':
          content:
            application/json:
