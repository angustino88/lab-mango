  /api/labs/purchases/{purchase_id}/transactions:
    get:
      operationId: labs_purchases_transactions_retrieve_by_purchase_id
      description: List and create purchase payments or refunds.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: path
        name: purchase_id
        schema:
          type: integer
        required: true
      tags:
      - Procurement
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseTransactionListSerializersPurchaseTransactionPaginatedResponse'
