components:
  schemas:
    Choice:
      type: object
      description: ENU-1 ``{value, label}``.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    DraftLineInput:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type: string
          maxLength: 2000
        purpose:
          type: string
          nullable: true
          maxLength: 2000
        priority_id:
          type: integer
          minimum: 1
          nullable: true
        unit:
          type: string
          nullable: true
          maxLength: 32
      required:
      - description
      - quantity
      - unit_price
    PatchedDraftLinePatchInput:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
        quantity:
          type: integer
          maximum: 1000000
          minimum: 1
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type: string
          maxLength: 2000
        purpose:
          type: string
          nullable: true
          maxLength: 2000
        priority_id:
          type: integer
          minimum: 1
          nullable: true
        unit:
          type: string
          nullable: true
          maxLength: 32
    PatchedPurchaseDraftHeaderInput:
      type: object
      properties:
        supplier:
          type: string
          maxLength: 255
        purchase_date:
          type: string
          format: date
        purchase_order_number:
          type: string
          maxLength: 100
        currency:
          type: string
          maxLength: 3
          minLength: 3
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        notes:
          type: string
          maxLength: 2000
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    Purchase:
      type: object
      description: Base model serializer that automatically exposes created_at and
        updated_at from TimeStampedModel.
      properties:
        id:
          type: integer
          readOnly: true
        supplier:
          type: string
          maxLength: 255
        purchase_order_number:
          type: string
          maxLength: 100
        purchase_date:
          type: string
          format: date
        currency:
          type: string
          description: ISO 4217 currency code.
          maxLength: 3
        status:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          description: Agreed total purchase amount.
        total:
          type: object
          properties:
            amount:
              type: string
              pattern: ^-?[0-9]+(\.[0-9]+)?$
            currency:
              type: string
              description: Purchase currency code.
          required:
          - amount
          - currency
          additionalProperties: false
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseItem'
          writeOnly: true
      required:
      - created_at
      - id
      - item_count
      - purchase_date
      - status
      - supplier
      - total
      - total_amount
      - updated_at
    PurchaseDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        supplier:
          type: string
          readOnly: true
        purchase_order_number:
          type: string
          readOnly: true
        purchase_date:
          type: string
          format: date
          readOnly: true
        currency:
          type: string
          readOnly: true
          description: ISO 4217 currency code.
        total_amount:
          type: object
          properties:
            amount:
              type: string
              pattern: ^-?[0-9]+(\.[0-9]+)?$
            currency:
              type: string
              description: Purchase currency code.
          required:
          - amount
          - currency
          additionalProperties: false
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        notes:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        item_count:
          type: integer
          readOnly: true
        lines_total:
          type: object
          properties:
            amount:
              type: string
              pattern: ^-?[0-9]+(\.[0-9]+)?$
            currency:
              type: string
              description: Purchase currency code.
          required:
          - amount
          - currency
          additionalProperties: false
          readOnly: true
        unpriced_line_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - currency
      - id
      - item_count
      - lines_total
      - notes
      - purchase_date
      - purchase_order_number
      - status
      - supplier
      - total_amount
      - unpriced_line_count
      - updated_at
      - version
    PurchaseDetailSerializersPurchaseDetailDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/PurchaseDetail'
      required:
