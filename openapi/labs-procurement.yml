          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Update Purchases Draft by Purchase ID
  /api/labs/purchases/{purchase_id}/items:
