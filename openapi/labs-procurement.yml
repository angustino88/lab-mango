openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/purchase-items/{purchase_item_id}/resources:
    get:
      operationId: labs_purchase_items_resources_retrieve_by_purchase_item_id
      description: List and allocate physical resources to a purchase line.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: path
        name: purchase_item_id
        schema:
          type: integer
        required: true
      tags:
      - Procurement
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseItemResourceListSerializersPurchaseItemResourcePaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Purchase Items Resources by Purchase Item ID
    post:
      operationId: labs_purchase_items_resources_create_by_purchase_item_id
      description: List and allocate physical resources to a purchase line.
      parameters:
      - in: path
        name: purchase_item_id
        schema:
          type: integer
        required: true
      tags:
      - Procurement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseItemResourceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PurchaseItemResourceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PurchaseItemResourceCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseItemResourceSerializersPurchaseItemResourceDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Purchase Items Resources by Purchase Item ID
  /api/labs/purchase-priorities:
    get:
      operationId: labs_purchase_priorities_retrieve
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: query
        name: include_inactive
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
          default: 'false'
          minLength: 1
        description: '* `true` - true

          * `false` - false'
      tags:
      - Procurement
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchasePriorityOptionsSerializersPurchasePriorityOptionListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Purchase Priorities
  /api/labs/purchases:
    get:
      operationId: labs_purchases_retrieve
      description: List and create procurement purchase orders.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      tags:
      - Procurement
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseListSerializersPurchasePaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Purchases
    post:
      operationId: labs_purchases_create
      description: List and create procurement purchase orders.
      tags:
      - Procurement
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Purchase'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Purchase'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Purchase'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSerializersPurchaseDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Purchases
  /api/labs/purchases/{purchase_id}:
    get:
      operationId: labs_purchases_retrieve_by_purchase_id
      description: HTTP mapping for domain commands and selector projections.
      parameters:
      - in: path
        name: purchase_id
        schema:
