  /api/labs/benches/availability:
    get:
      operationId: labs_benches_availability_retrieve
      description: Benches free in a window, and when the others are busy. Busy time
        never names who booked it.
      parameters:
      - in: query
        name: bench_group_id
        schema:
          type: string
          minLength: 1
      - in: query
        name: bench_id
        schema:
          type: string
          minLength: 1
        description: Only these benches.
      - in: query
        name: ends_at
        schema:
          type: string
          format: date-time
        description: Window end (exclusive). The window is at most 14 days.
        required: true
      - in: query
        name: has_computing
        schema:
          type: boolean
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 10
      - in: query
        name: min_free_minutes
        schema:
          type: integer
          maximum: 20160
          minimum: 10
        description: 'With mode=any_free: the shortest useful free period.'
      - in: query
        name: mode
        schema:
          enum:
          - fully_free
          - any_free
          type: string
          default: fully_free
          minLength: 1
        description: '* `fully_free` - Free for the whole window

          * `any_free` - Some free time in the window'
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Bench name or SKU.
      - in: query
        name: setup_location_id
        schema:
          type: string
          minLength: 1
        description: Station ids.
      - in: query
        name: starts_at
        schema:
          type: string
          format: date-time
        description: Window start, RFC 3339 with offset.
        required: true
      - in: query
        name: type_id
        schema:
          type: string
          minLength: 1
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchAvailabilitySerializersBenchAvailabilityResultDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Benches Availability
  /api/labs/lab-projects:
