openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/bench-bookings:
    get:
      operationId: labs_bench_bookings_retrieve
      description: HTTP mapping for domain commands and selector projections.
      parameters:
      - in: query
        name: approval_status
        schema:
          type: string
          minLength: 1
      - in: query
        name: bench_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: booking_code
        schema:
          type: string
          minLength: 1
      - in: query
        name: creator_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: ordering
        schema:
          type: string
          minLength: 1
        description: 'Comma-separated ordering fields: starts_at, ends_at, created_at,
          id; prefix with ''-'' for descending. Defaults to -starts_at,-id. An id
          tie-breaker is added when omitted.'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: project_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
      - in: query
        name: starts_at_after
        schema:
          type: string
        description: "Inclusive lower bound. Accepts strict YYYY-MM-DD in Django TIME_ZONE\
          \ or an offset-aware RFC3339 datetime (YYYY-MM-DDTHH:MM:SS[.fraction](Z|\xB1\
          HH:MM))."
      - in: query
        name: starts_at_before
        schema:
          type: string
        description: "Exclusive upper bound. Accepts strict YYYY-MM-DD in Django TIME_ZONE\
          \ or an offset-aware RFC3339 datetime (YYYY-MM-DDTHH:MM:SS[.fraction](Z|\xB1\
          HH:MM)). A date-only value is midnight at the start of that date; to include\
          \ November 2\u20138, use starts_at_after=2026-11-02 and starts_at_before=2026-11-09."
      - in: query
        name: status
        schema:
          type: string
          minLength: 1
      - in: query
        name: view_side
        schema:
          enum:
          - my_booking
          - booking_calendar
          type: string
          minLength: 1
        description: '* `my_booking` - my_booking

          * `booking_calendar` - booking_calendar'
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchBookingListSerializersBenchBookingPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Bench Bookings
    post:
      operationId: labs_bench_bookings_create
      description: HTTP mapping for domain commands and selector projections.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: 'Optional UUID. A repeat with the same key and body replays the
          first successful response for 24 hours (Idempotency-Replayed: true); the
          same key with another body or booking returns 422.'
      tags:
      - Bench Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchBookingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BenchBookingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BenchBookingCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchBookingCreateSerializersBenchBookingDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Bench Bookings
