      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: Required UUID. A matching completed request replays its original
          response for 24 hours; reuse with a different request returns 422.
        required: true
      - in: path
        name: booking_id
        schema:
          type: integer
        required: true
      tags:
