  /api/labs/bench-bookings/reference-data/projects:
    get:
      operationId: labs_bench_bookings_reference_data_projects_retrieve
      description: List LabProject reference records in a paginated data envelope.
        Validates the declared search, relation and pagination query parameters and
        delegates filtering and access checks to the owner-provided listing callback.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
          nullable: true
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
          minLength: 1
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabProjectReferenceListSerializersLabProjectCatalogRecordPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Bench Bookings Reference Data Projects
    post:
      operationId: labs_bench_bookings_reference_data_projects_create
      description: 'Create a LabProject reference record from the declared writable
        fields. Passes the validated values, authenticated user and Idempotency-Key
        to the owner-provided create callback. Returns a 201 data envelope with Location;
        a replay reported by the callback also includes Idempotency-Replayed: true.'
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Required replay key (max 128 characters); receipts retained until
          explicitly purged.
        required: true
      tags:
      - Bench Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabProjectCatalogCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LabProjectCatalogCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LabProjectCatalogCreate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabProjectReferenceCreateSerializersLabProjectCatalogRecordDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Bench Bookings Reference Data Projects
  /api/labs/bench-bookings/reference-data/projects/{reference_id}:
    get:
      operationId: labs_bench_bookings_reference_data_projects_retrieve_by_reference_id
      description: Retrieve one LabProject reference record by reference_id in a data
        envelope. Delegates lookup and access checks to the owner-provided retrieve
        callback; a missing or unavailable record is documented as 404.
      parameters:
      - in: path
        name: reference_id
        schema:
          type: integer
        required: true
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabProjectReferenceDetailSerializersLabProjectCatalogRecordDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Bench Bookings Reference Data Projects by Reference ID
  /api/labs/lab-projects:
    get:
      operationId: labs_lab_projects_retrieve
      description: List the lab projects a booking can be charged to.
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
          nullable: true
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
          minLength: 1
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabProjectListSerializersLabProjectPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Lab Projects
  /api/labs/lab-projects/{project_id}:
    get:
      operationId: labs_lab_projects_retrieve_by_project_id
      description: Retrieve one lab project.
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        required: true
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabProjectDetailSerializersLabProjectDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Lab Projects by Project ID
  /api/labs/lab-projects/options:
    get:
      operationId: labs_lab_projects_options_retrieve
      description: Selector options for lab projects.
      parameters:
      - in: query
        name: active_on
        schema:
          type: string
          format: date
        description: Date within project starts_on and ends_on.
      - in: query
        name: include_ids
        schema:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 50
          uniqueItems: true
        description: Comma-separated positive integers (at most 50) of retired rows
          to include.
        style: form
        explode: false
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Search text (1 to 100 characters).
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOptionList'
          description: Standard selector options list
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Invalid selector query parameters (invalid_query) or result
            cap exceeded (too_many_results).
        '304':
          description: Not modified
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Access denied by the existing API-key or authenticated-user
            permission policy.
      x-owner: bench_bookings
      summary: Get Lab Projects Options
components:
  schemas:
    BenchBooking:
      type: object
      description: Base model serializer that automatically exposes created_at and
        updated_at from TimeStampedModel.
      properties:
        id:
          type: integer
          readOnly: true
        booking_code:
          type: string
          readOnly: true
        creator:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
          nullable: true
        bench:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        project:
          allOf:
