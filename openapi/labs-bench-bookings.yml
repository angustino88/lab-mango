          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBenchBookingUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBenchBookingUpdate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchBookingUpdateSerializersBenchBookingDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Update Bench Bookings by Booking ID
  /api/labs/bench-bookings/{booking_id}/actions/approve:
    post:
      operationId: labs_bench_bookings_actions_approve_create_by_booking_id
