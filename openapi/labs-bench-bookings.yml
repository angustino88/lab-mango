  /api/labs/lab-projects/options:
    get:
      operationId: labs_lab_projects_options_retrieve
      description: Selector options for lab projects.
      parameters:
      - in: query
        name: active_on
        schema:
          type: string
          format: date
        description: Date within project start_date and end_date.
      - in: query
        name: include_ids
        schema:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 50
          uniqueItems: true
        description: Comma-separated positive integers (at most 50) of retired rows
          to include.
        style: form
        explode: false
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Search text (1 to 100 characters).
      tags:
      - Bench Bookings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOptionList'
          description: Standard selector options list
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Invalid selector query parameters (invalid_query) or result
            cap exceeded (too_many_results).
        '304':
          description: Not modified
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Access denied by the existing API-key or authenticated-user
            permission policy.
      x-owner: bench_bookings
      summary: Get Lab Projects Options
components:
  schemas:
    AvailabilityBusyPeriod:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
          description: booking or downtime. Holders are never shown.
      required:
      - ends_at
      - reason
      - starts_at
    AvailabilityPeriod:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ends_at
      - starts_at
    BenchAvailability:
      type: object
      properties:
        bench:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
        station:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
          nullable: true
        room:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        has_computing:
          type: boolean
          readOnly: true
        is_fully_free:
          type: boolean
          readOnly: true
        is_favorite:
          type: boolean
          readOnly: true
        next_free_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        free_periods:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityPeriod'
          readOnly: true
        busy_periods:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityBusyPeriod'
          readOnly: true
      required:
      - bench
      - busy_periods
      - free_periods
      - has_computing
      - is_favorite
      - is_fully_free
      - next_free_at
      - room
      - station
      - type
    BenchAvailabilityResult:
      type: object
      description: 'Ranked: fully free first, then favorites, then the longest free
        period.'
      properties:
        window_starts_at:
          type: string
          format: date-time
          readOnly: true
        window_ends_at:
          type: string
          format: date-time
          readOnly: true
        is_truncated:
          type: boolean
          readOnly: true
          description: More benches matched than were returned.
        benches:
          type: array
          items:
            $ref: '#/components/schemas/BenchAvailability'
          readOnly: true
      required:
      - benches
      - is_truncated
      - window_ends_at
      - window_starts_at
    BenchAvailabilitySerializersBenchAvailabilityResultDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/BenchAvailabilityResult'
      required:
      - data
    BenchBooking:
      type: object
      description: Base model serializer that automatically exposes created_at and
        updated_at from TimeStampedModel.
      properties:
        id:
          type: integer
          readOnly: true
        booking_code:
          type: string
          readOnly: true
        creator:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
          nullable: true
        bench:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: 'When the booking was completed: when the user ended it, or
            its end time when the scheduled job completed it. Set exactly when the
            status is completed. ends_at keeps the booked end.'
        status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        project:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - bench
      - booking_code
      - completed_at
      - created_at
      - creator
      - ends_at
      - id
      - project
      - reason
      - starts_at
      - status
      - updated_at
    BenchBookingAlternative:
      type: object
      properties:
        bench:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bench
      - ends_at
      - starts_at
    BenchBookingApproveActionSerializersBenchBookingDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/BenchBooking'
      required:
      - data
    BenchBookingCancelAction:
      type: object
      properties:
        reason:
          type: string
          default: Cancelled by user
    BenchBookingCancelActionSerializersBenchBookingDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/BenchBooking'
      required:
      - data
    BenchBookingCancelByCodeActionSerializersBenchBookingDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/BenchBooking'
      required:
      - data
    BenchBookingCheck:
      type: object
      description: 'Advice for now: create and update check again under their locks.'
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BenchBookingCheckResult'
          readOnly: true
        can_book_all:
          type: boolean
          readOnly: true
          description: Whether every period is bookable now.
      required:
      - can_book_all
      - results
    BenchBookingCheckActionSerializersBenchBookingCheckDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/BenchBookingCheck'
      required:
      - data
    BenchBookingCheckPeriod:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      required:
      - ends_at
      - starts_at
    BenchBookingCheckRequest:
      type: object
      description: 'The create body, or a change to ``booking_id``. Omitted fields
        of a change keep the booking''s values.


        ``reason`` is accepted so the create body can be sent unchanged; it is not
        checked here.'
      properties:
        booking_id:
          type: integer
          minimum: 1
        bench_id:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        project_id:
          type: integer
          minimum: 1
        reason:
          type: string
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/BenchBookingCheckPeriod'
          description: 'A series for a new booking: up to 10 periods, checked one
            by one. Replaces starts_at/ends_at.'
          maxItems: 10
          minItems: 1
        suggest_alternatives:
          type: boolean
          default: false
          description: 'For a period that is not bookable: up to two other benches
            of the same type, then this bench''s next free slot of the same length
            within a day.'
    BenchBookingCheckResult:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        is_bookable:
          type: boolean
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          nullable: true
          readOnly: true
          description: Approval the booking would have after the write; null when
            the period is invalid.
        problems:
          type: array
          items:
            $ref: '#/components/schemas/BenchBookingProblem'
          readOnly: true
        alternatives:
          type: array
          items:
            $ref: '#/components/schemas/BenchBookingAlternative'
          readOnly: true
          description: Empty unless suggest_alternatives was sent. Free now, not held.
      required:
      - alternatives
      - approval_status
      - ends_at
      - is_bookable
      - problems
      - starts_at
    BenchBookingCompleteActionSerializersBenchBookingDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/BenchBooking'
      required:
      - data
    BenchBookingCreate:
      type: object
