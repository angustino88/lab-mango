openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/audit-catalog:
    get:
      operationId: labs_audit_catalog_retrieve
      description: Cursor-paged catalog of every auditable resource for the offline
        audit tool.
      parameters:
      - in: query
        name: changed_since
        schema:
          type: string
          format: date-time
        description: Return only rows created, changed or deleted at or after this
          time. Omit for a full download.
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 2048
          minLength: 1
        description: Opaque next_cursor from the previous page. Send it alone; it
          carries the filter and page size.
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 500
      tags:
      - Resource Audit
      security:
      - entraAccessToken: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditCatalogResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Audit Catalog
  /api/labs/audits:
    get:
      operationId: labs_audits_retrieve
      description: Query and filter audits across all lab resources.
      parameters:
      - in: query
        name: auditor_id
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
          minLength: 1
        description: Free-text search term.
      - in: query
        name: resource_type
        schema:
          type: string
          minLength: 1
      - in: query
        name: result
        schema:
          enum:
          - PASS
          - FAIL
          - NOT_ASSESSED
          - OK
          - NOK
          type: string
          minLength: 1
        description: '* `PASS` - PASS

          * `FAIL` - FAIL

          * `NOT_ASSESSED` - NOT_ASSESSED

          * `OK` - OK

          * `NOK` - NOK'
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
        description: Deprecated alias of `q` (QRY-7); send `q`. Kept for one release.
        deprecated: true
      tags:
      - Resource Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllResourceAuditListSerializersResourceAuditItemPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Audits
  /api/labs/audits/{audit_id}:
    get:
      operationId: labs_audits_retrieve_by_audit_id
      description: Retrieve, update, or delete a single audit entry.
      parameters:
      - in: path
        name: audit_id
        schema:
          type: integer
        required: true
      tags:
      - Resource Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditDetailSerializersResourceAuditItemDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Audits by Audit ID
    patch:
      operationId: labs_audits_partial_update_by_audit_id
      description: Retrieve, update, or delete a single audit entry.
      parameters:
      - in: path
        name: audit_id
        schema:
          type: integer
        required: true
      tags:
      - Resource Audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateResourceAuditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateResourceAuditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateResourceAuditRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditDetailSerializersResourceAuditItemDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Update Audits by Audit ID
    delete:
      operationId: labs_audits_destroy_by_audit_id
      description: Retrieve, update, or delete a single audit entry.
      parameters:
      - in: path
        name: audit_id
        schema:
          type: integer
        required: true
      tags:
      - Resource Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Delete Audits by Audit ID
  /api/labs/resources/{resource_type}/{resource_id}/audits:
    get:
      operationId: labs_resources_audits_retrieve_by_resource_type_resource_id
      description: List or record audits for a typed resource.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: path
        name: resource_id
        schema:
          type: string
        required: true
      - in: path
        name: resource_type
        schema:
          type: string
        required: true
      tags:
      - Resource Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypedResourceAuditListSerializersResourceAuditItemPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Resources Audits by Resource Type Resource ID
    post:
      operationId: labs_resources_audits_create_by_resource_type_resource_id
      description: List or record audits for a typed resource.
      parameters:
      - in: path
        name: resource_id
        schema:
          type: string
        required: true
      - in: path
        name: resource_type
        schema:
          type: string
        required: true
      tags:
      - Resource Audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypedResourceAuditItemSerializersResourceAuditItemDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Resources Audits by Resource Type Resource ID
  /api/labs/resources/id/{resource_id}/audits:
    get:
      operationId: labs_resources_id_audits_retrieve_by_resource_id
      description: List or record audits for a resource identified by integer ID.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      tags:
      - Resource Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditListByIdSerializersResourceAuditItemPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Resources ID Audits by Resource ID
    post:
      operationId: labs_resources_id_audits_create_by_resource_id
      description: List or record audits for a resource identified by integer ID.
      parameters:
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      tags:
      - Resource Audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditItemByIdSerializersResourceAuditItemDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Resources ID Audits by Resource ID
  /api/labs/resources/sku/{sku}/audits:
    get:
      operationId: labs_resources_sku_audits_retrieve_by_sku
      description: List or record audits for a resource identified by business SKU.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - Resource Audit
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditListBySkuSerializersResourceAuditItemPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Resources SKU Audits by SKU
    post:
      operationId: labs_resources_sku_audits_create_by_sku
      description: List or record audits for a resource identified by business SKU.
      parameters:
      - in: path
        name: sku
        schema:
          type: string
        required: true
      tags:
      - Resource Audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditItemBySkuSerializersResourceAuditItemDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Resources SKU Audits by SKU
  /api/labs/resources/uid/{uid}/audits:
    get:
      operationId: labs_resources_uid_audits_retrieve_by_uid
      description: List or record audits for a resource identified by system UUID.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: path
        name: uid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Resource Audit
      security:
      - entraAccessToken: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditListByUidSerializersResourceAuditItemPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Resources UID Audits by UID
    post:
      operationId: labs_resources_uid_audits_create_by_uid
      description: List or record audits for a resource identified by system UUID.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Optional replay key, 1 to 128 characters (the audit tool sends
          a UUID), scoped to the auditor. Same key and body returns the stored audit
          with Idempotency-Replayed: true; same key with a different body returns
          422 idempotency_key_reuse. Keys are kept with the audit for as long as the
          audit exists.'
      - in: path
        name: uid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Resource Audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordResourceAuditRequest'
        required: true
      security:
      - entraAccessToken: []
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceAuditItemByUidSerializersResourceAuditItemDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Resources UID Audits by UID
components:
  schemas:
    AllResourceAuditListSerializersResourceAuditItemPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/AllResourceAuditListSerializersResourceAuditItemPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAuditItem'
      required:
      - data
      - meta
    AllResourceAuditListSerializersResourceAuditItemPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    AllResourceAuditListSerializersResourceAuditItemPaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/AllResourceAuditListSerializersResourceAuditItemPagination'
      required:
      - pagination
    AuditCatalogItem:
      type: object
      description: One auditable resource as the audit tool stores it offline. Never
        carries license keys.
      properties:
        uid:
          type: string
          format: uuid
        resource_type:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        sku:
          type: string
        name:
          type: string
        serial_number:
          type: string
          description: Equipment only; empty for other types.
        status:
          type: string
          description: Equipment lifecycle_state; bench, station or room lifecycle_status;
            or the newest status record of a license; empty when none exists.
        condition:
          type: string
          description: Computed from downtime (operational, in_maintenance, out_of_service);
            empty for licenses.
        location:
          type: string
          description: 'Bench: setup station name. Station: room name. Room: building
            name. Otherwise empty.'
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: License expiry; null for other types.
        updated_at:
          type: string
          format: date-time
        is_deleted:
          type: boolean
          description: True when the resource was deleted; remove it from the local
            copy.
      required:
      - condition
      - expires_at
      - is_deleted
      - location
      - name
      - resource_type
      - serial_number
      - sku
      - status
      - uid
      - updated_at
    AuditCatalogMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/AuditCatalogPagination'
        sync_started_at:
          type: string
          format: date-time
          description: Time the sync started. Store it and send it as changed_since
            on the next sync.
      required:
      - pagination
      - sync_started_at
    AuditCatalogPagination:
      type: object
      properties:
        count:
          type: integer
          nullable: true
          description: 'Always null: not computed for cursor pages.'
        page_size:
          type: integer
          minimum: 1
        next_cursor:
          type: string
          nullable: true
        previous_cursor:
          type: string
          nullable: true
          description: 'Always null: the catalog pages forward only.'
      required:
      - count
      - next_cursor
      - page_size
      - previous_cursor
    AuditCatalogResponse:
      type: object
      description: Cursor-paged envelope; reserved keys are declared in get_fields
        for schema generation.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditCatalogItem'
        meta:
          $ref: '#/components/schemas/AuditCatalogMeta'
      required:
      - data
      - meta
    AuditResultInputEnum:
      enum:
      - PASS
      - FAIL
      - NOT_ASSESSED
      - OK
      - NOK
      type: string
      description: '* `PASS` - PASS

        * `FAIL` - FAIL

        * `NOT_ASSESSED` - NOT_ASSESSED

        * `OK` - OK

        * `NOK` - NOK'
    AuditedResource:
      type: object
      description: REL-13 polymorphic relation to the audited resource.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/AuditedResourceTypeEnum'
          readOnly: true
      required:
      - id
      - name
      - type
    AuditedResourceTypeEnum:
      enum:
      - equipment
      - bench
      - station
      - room
      - license
      type: string
      description: '* `equipment` - equipment

        * `bench` - bench

        * `station` - station

        * `room` - room

        * `license` - license'
    Choice:
      type: object
      description: ENU-1 ``{value, label}``.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    PatchedUpdateResourceAuditRequest:
      type: object
      description: Payload to update an existing audit record.
      properties:
        result:
          $ref: '#/components/schemas/AuditResultInputEnum'
        remarks:
          type: string
          maxLength: 255
        audited_at:
          type: string
          format: date-time
          nullable: true
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    RecordResourceAuditRequest:
      type: object
      description: Payload to record an audit on a specific resource.
      properties:
        result:
          $ref: '#/components/schemas/AuditResultInputEnum'
        remarks:
          type: string
          default: ''
          maxLength: 255
        audited_at:
          type: string
          format: date-time
          nullable: true
      required:
      - result
    ResourceAuditDetailSerializersResourceAuditItemDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/ResourceAuditItem'
      required:
      - data
    ResourceAuditItem:
      type: object
      description: Full detail of a recorded resource audit.
      properties:
        id:
          type: integer
          readOnly: true
        resource:
          allOf:
          - $ref: '#/components/schemas/AuditedResource'
          readOnly: true
        auditor:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
        result:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        remarks:
          type: string
          maxLength: 255
        audited_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audited_at
      - auditor
      - created_at
      - id
      - resource
      - result
    ResourceAuditItemByIdSerializersResourceAuditItemDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/ResourceAuditItem'
      required:
      - data
    ResourceAuditItemBySkuSerializersResourceAuditItemDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/ResourceAuditItem'
      required:
      - data
    ResourceAuditItemByUidSerializersResourceAuditItemDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/ResourceAuditItem'
      required:
      - data
    ResourceAuditListByIdSerializersResourceAuditItemPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/ResourceAuditListByIdSerializersResourceAuditItemPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ResourceAuditItem'
      required:
      - data
      - meta
    ResourceAuditListByIdSerializersResourceAuditItemPagination:
      type: object
