openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/send-otp:
    post:
      operationId: send_otp_create
      description: Deliver a one-time verification password to the requested user.
      tags:
      - User Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendOTP'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendOTPSerializerSendOTPResponseDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Send OTP
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    SendOTP:
      type: object
      properties:
        username:
          type: string
          maxLength: 255
        otp:
          type: string
          maxLength: 64
      required:
      - otp
      - username
    SendOTPResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    SendOTPSerializerSendOTPResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/SendOTPResponse'
      required:
      - data
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: User Authentication
  description: User Authentication endpoints
