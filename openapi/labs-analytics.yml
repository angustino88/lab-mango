      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabVisitAnalyticsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics Lab Visits
    post:
      operationId: labs_analytics_lab_visits_create
      description: Retrieve visit trend metrics or record an access visit event.
      tags:
      - Analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabVisitLogCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LabVisitLogCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LabVisitLogCreate'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabVisitCreatedSerializersLabVisitLogResponseDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
