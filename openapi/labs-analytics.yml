        required: true
      - in: query
        name: order
        schema:
          type: string
          default: desc
          minLength: 1
      - in: query
        name: to_date_time
        schema:
          type: string
          minLength: 1
        required: true
      - in: query
        name: top
        schema:
          type: integer
          minimum: 1
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
