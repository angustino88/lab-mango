  /api/labs/analytics/user-lab-usage:
    get:
      operationId: labs_analytics_user_lab_usage_retrieve
      description: Existing session usage report.
      parameters:
      - in: query
        name: from_date_time
        schema:
          type: string
          minLength: 1
        required: true
      - in: query
        name: order
        schema:
          type: string
          default: desc
          minLength: 1
      - in: query
        name: to_date_time
        schema:
          type: string
          minLength: 1
        required: true
      - in: query
        name: top
        schema:
          type: integer
          minimum: 1
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLabUsageSerializersUserLabUsageListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics User Lab Usage
components:
  schemas:
    ActiveBenchesMetric:
      type: object
      properties:
        count:
          type: integer
      required:
      - count
    AnalyticsAggregatedLog:
      type: object
      description: Bucket-aggregated historical metrics row.
      properties:
        date:
          type: string
        year:
          type: integer
        week:
          type: integer
        month:
          type: integer
        quarter:
          type: integer
        count:
          type: integer
      required:
      - count
    AnalyticsCountTrend:
      type: object
      description: Aggregate count and week-over-week trend.
      properties:
        count:
          type: integer
        trend:
          type: number
          format: double
      required:
      - count
      - trend
    BenchGroupSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        bench_group_name:
          type: string
        total_benches:
          type: integer
        active_benches:
          type: integer
        entries:
          type: integer
      required:
      - active_benches
      - id
      - name
      - total_benches
    BenchGroupSummarySerializersBenchGroupSummaryListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BenchGroupSummary'
      required:
      - data
    BookedVsUsed:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        total_booked_hours:
          type: number
          format: double
        total_used_hours:
          type: number
          format: double
        used_to_booked_ratio:
          type: number
          format: double
          nullable: true
        official_working_hours:
          type: number
          format: double
        benches:
          type: array
          items:
            $ref: '#/components/schemas/BookedVsUsedBench'
      required:
      - benches
      - official_working_hours
      - period
      - total_booked_hours
      - total_used_hours
      - used_to_booked_ratio
    BookedVsUsedAnalyticsSerializersBookedVsUsedDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/BookedVsUsed'
      required:
      - data
    BookedVsUsedBench:
      type: object
      properties:
        bench:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
        booked_hours:
          type: number
          format: double
      required:
      - bench
      - booked_hours
    BookingCountAnalyticsResponse:
      type: object
      description: Schema-only envelope; create the proxy fresh to retain its explicit
        many=False.
      properties:
        data:
          $ref: '#/components/schemas/BookingCountAnalyticsResponsePayload'
      required:
      - data
    BookingCountAnalyticsResponsePayload:
      oneOf:
      - $ref: '#/components/schemas/AnalyticsCountTrend'
      - type: array
        items:
          $ref: '#/components/schemas/AnalyticsAggregatedLog'
    Choice:
      type: object
      description: ENU-1 ``{value, label}``.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    CountTrendMetric:
      type: object
      properties:
        count:
          type: integer
        previous_count:
          type: integer
        trend_percent:
          type: integer
      required:
      - count
      - previous_count
      - trend_percent
    DashboardSummary:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        period:
          $ref: '#/components/schemas/ReportPeriod'
        bookings:
          $ref: '#/components/schemas/CountTrendMetric'
        facility_visits:
          $ref: '#/components/schemas/CountTrendMetric'
        active_benches:
          $ref: '#/components/schemas/ActiveBenchesMetric'
      required:
      - active_benches
      - bookings
      - facility_visits
      - generated_at
      - period
    DashboardSummaryAnalyticsSerializersDashboardSummaryDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/DashboardSummary'
      required:
      - data
    EquipmentAvailability:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/ReportPeriod'
        equipment_count:
          type: integer
        average_uptime_percent:
          type: number
          format: double
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentAvailabilityItem'
      required:
      - average_uptime_percent
      - equipment_count
      - items
      - period
    EquipmentAvailabilityAnalyticsSerializersEquipmentAvailabilityDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/EquipmentAvailability'
      required:
      - data
    EquipmentAvailabilityItem:
      type: object
      properties:
        equipment:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
        uptime_percent:
          type: number
          format: double
        unavailable_hours:
          type: number
          format: double
        outage_count:
          type: integer
        current_status:
          type: string
      required:
      - current_status
      - equipment
      - outage_count
      - unavailable_hours
      - uptime_percent
    EquipmentStatusSummary:
      type: object
      properties:
        status:
          type: string
        count:
          type: integer
        entries:
          type: integer
      required:
      - count
      - status
    EquipmentStatusSummarySerializersEquipmentStatusSummaryListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentStatusSummary'
      required:
      - data
    FinanceBreakdown:
      type: object
      properties:
        currency:
          type: string
        start_month:
          type: string
        end_month:
          type: string
        timezone:
          type: string
        period:
          $ref: '#/components/schemas/FinancePeriod'
        combined:
          $ref: '#/components/schemas/FinanceTotals'
        sources:
          $ref: '#/components/schemas/FinanceSources'
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceBreakdownItem'
      required:
      - combined
      - currency
      - end_month
      - items
      - period
      - sources
      - start_month
      - timezone
    FinanceBreakdownAnalyticsSerializersFinanceBreakdownDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/FinanceBreakdown'
      required:
      - data
    FinanceBreakdownItem:
      type: object
      properties:
        payments:
          $ref: '#/components/schemas/FinanceMoney'
        refunds:
          allOf:
          - $ref: '#/components/schemas/FinanceMoney'
          description: Negative cash-flow contribution of refunds.
        net:
          allOf:
          - $ref: '#/components/schemas/FinanceMoney'
          description: Payments plus signed refunds; may be negative.
        transaction_count:
          type: integer
        expense_type:
          type: string
          description: Expense-owned type, or procurement for purchases with no expense
            type.
        source:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
      required:
      - expense_type
      - net
      - payments
      - refunds
      - source
      - transaction_count
    FinanceMoney:
      type: object
      properties:
        amount:
          type: string
          description: Exact decimal string, two source-stored decimal places.
          pattern: ^-?[0-9]+\.[0-9]{2}$
        currency:
          type: string
      required:
      - amount
      - currency
    FinanceMonth:
      type: object
      properties:
        month:
          type: string
        combined:
          $ref: '#/components/schemas/FinanceTotals'
        sources:
          $ref: '#/components/schemas/FinanceSources'
      required:
      - combined
      - month
      - sources
    FinanceMonthlyTrends:
      type: object
      properties:
        currency:
          type: string
        start_month:
          type: string
        end_month:
          type: string
        timezone:
          type: string
        period:
          $ref: '#/components/schemas/FinancePeriod'
        combined:
          $ref: '#/components/schemas/FinanceTotals'
        sources:
          $ref: '#/components/schemas/FinanceSources'
        months:
          type: array
          items:
            $ref: '#/components/schemas/FinanceMonth'
          description: Chronological series, zero-filled for every requested month.
      required:
      - combined
      - currency
      - end_month
      - months
      - period
      - sources
      - start_month
      - timezone
    FinanceMonthlyTrendsAnalyticsSerializersFinanceMonthlyTrendsDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/FinanceMonthlyTrends'
      required:
      - data
    FinancePeriod:
      type: object
      description: NAM-9 ``period`` group read from ``period_start`` / ``period_end``.
      properties:
        starts_at:
          type: string
          format: date-time
          description: Inclusive instant at local first-month midnight, represented
            in UTC.
        ends_at:
          type: string
          format: date-time
          description: Exclusive instant at local midnight following end_month, represented
            in UTC.
      required:
      - ends_at
      - starts_at
    FinanceProblemResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    FinanceSources:
      type: object
      properties:
        expense:
          $ref: '#/components/schemas/FinanceTotals'
        procurement:
          $ref: '#/components/schemas/FinanceTotals'
      required:
      - expense
      - procurement
    FinanceSummary:
      type: object
      properties:
        currency:
          type: string
        start_month:
          type: string
        end_month:
          type: string
        timezone:
          type: string
        period:
          $ref: '#/components/schemas/FinancePeriod'
        combined:
          $ref: '#/components/schemas/FinanceTotals'
        sources:
          $ref: '#/components/schemas/FinanceSources'
      required:
      - combined
      - currency
      - end_month
      - period
      - sources
      - start_month
      - timezone
    FinanceSummaryAnalyticsSerializersFinanceSummaryDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/FinanceSummary'
      required:
      - data
    FinanceTotals:
      type: object
      properties:
        payments:
          $ref: '#/components/schemas/FinanceMoney'
        refunds:
          allOf:
          - $ref: '#/components/schemas/FinanceMoney'
          description: Negative cash-flow contribution of refunds.
        net:
          allOf:
          - $ref: '#/components/schemas/FinanceMoney'
          description: Payments plus signed refunds; may be negative.
        transaction_count:
          type: integer
      required:
      - net
      - payments
      - refunds
      - transaction_count
    LabCountAnalyticsResponse:
      type: object
      description: Schema-only envelope; create the proxy fresh to retain its explicit
        many=False.
      properties:
        data:
          $ref: '#/components/schemas/LabCountAnalyticsResponsePayload'
      required:
      - data
    LabCountAnalyticsResponsePayload:
      oneOf:
      - $ref: '#/components/schemas/AnalyticsCountTrend'
      - type: array
        items:
          $ref: '#/components/schemas/AnalyticsAggregatedLog'
    LabEfficiency:
      type: object
      properties:
        name:
          type: string
        lab_name:
          type: string
        computer_name:
          type: string
        efficiency:
          type: number
          format: double
        duration:
          type: number
          format: double
        booking:
          type: integer
      required:
      - booking
      - computer_name
      - duration
      - efficiency
      - lab_name
      - name
    LabEfficiencySerializersLabEfficiencyListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LabEfficiency'
      required:
      - data
    LabUsageTimeframe:
      type: object
      properties:
        timeslot:
          type: string
        usage:
          type: number
          format: double
      required:
      - timeslot
      - usage
    LabUsageTimeframeSerializersLabUsageTimeframeListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LabUsageTimeframe'
      required:
      - data
    LabVisitAnalyticsResponse:
      type: object
      description: Schema-only envelope; create the proxy fresh to retain its explicit
        many=False.
      properties:
        data:
          $ref: '#/components/schemas/LabVisitAnalyticsResponsePayload'
      required:
      - data
    LabVisitAnalyticsResponsePayload:
      oneOf:
      - $ref: '#/components/schemas/AnalyticsCountTrend'
      - type: array
        items:
          $ref: '#/components/schemas/AnalyticsAggregatedLog'
    LabVisitCreatedSerializersLabVisitLogResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/LabVisitLogResponse'
      required:
      - data
    LabVisitLogCreate:
      type: object
      description: Input payload for creating a laboratory visit record.
      properties:
        facility_identifier:
          type: string
          default: ''
        external_reference:
          type: string
          default: ''
    LabVisitLogResponse:
      type: object
      description: Response payload for recorded laboratory visits.
      properties:
        id:
          type: integer
        facility_identifier:
          type: string
        occurred_at:
          type: string
          format: date-time
    LabsNamedReference:
      type: object
      description: Compact `{id, name}` object representation of a related entity.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    ProjectUsage:
      type: object
      properties:
        project_name:
          type: string
        usage:
          type: number
          format: double
      required:
      - project_name
      - usage
    ProjectUsageSerializersProjectUsageListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectUsage'
      required:
      - data
    ReportPeriod:
      type: object
      description: NAM-9 ``period`` group read from the row's ``period_start`` / ``period_end``.
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      required:
      - ends_at
      - starts_at
    StorageQuotaCreate:
      type: object
      description: Input payload for recording storage quota measurements.
      properties:
        account_identifier:
          type: string
        username:
          type: string
        used_gibibytes:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        used:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        quota_gibibytes:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        quota:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        computer_identifier:
          type: string
          default: ''
        computer_sku:
          type: string
          default: ''
        account_display_name:
          type: string
          default: ''
        user_displayname:
          type: string
          default: ''
        source:
          type: string
          default: collector
    StorageQuotaCreatedSerializersStorageQuotaListDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/StorageQuotaList'
      required:
      - data
    StorageQuotaList:
      type: object
      description: Storage capacity measurement representation.
      properties:
        username:
          type: string
        account_identifier:
          type: string
        account_display_name:
          type: string
        computer_identifier:
          type: string
        used:
          type: number
          format: double
        used_gibibytes:
          type: number
          format: double
        quota:
          type: number
          format: double
        quota_gibibytes:
          type: number
          format: double
        utilization_percent:
          type: number
          format: double
        measured_at:
          type: string
          format: date-time
      required:
      - account_identifier
      - measured_at
      - quota_gibibytes
      - used_gibibytes
      - utilization_percent
    StorageQuotaListSerializersStorageQuotaListListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorageQuotaList'
      required:
      - data
    UserBookingEfficiency:
      type: object
      properties:
        remote_user:
          type: string
        efficiency:
          type: number
          format: double
        remote_user_displayname:
          type: string
      required:
      - efficiency
      - remote_user
    UserBookingEfficiencySerializersUserBookingEfficiencyListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserBookingEfficiency'
      required:
      - data
    UserCountAnalyticsResponse:
      type: object
      description: Schema-only envelope; create the proxy fresh to retain its explicit
        many=False.
      properties:
        data:
          $ref: '#/components/schemas/UserCountAnalyticsResponsePayload'
      required:
      - data
    UserCountAnalyticsResponsePayload:
      oneOf:
      - $ref: '#/components/schemas/AnalyticsCountTrend'
      - type: array
        items:
          $ref: '#/components/schemas/AnalyticsAggregatedLog'
    UserLabUsage:
      type: object
      properties:
        remote_user:
          type: string
        usage:
          type: number
          format: double
        remote_user_displayname:
          type: string
      required:
      - remote_user
      - usage
    UserLabUsageSerializersUserLabUsageListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserLabUsage'
      required:
      - data
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    financeApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use Authorization: Api-Key <key>.'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Analytics
  description: Analytics endpoints
