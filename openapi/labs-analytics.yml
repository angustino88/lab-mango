openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/analytics/bench-group:
    get:
      operationId: labs_analytics_bench_group_retrieve
      description: Laboratory and bench distribution summary across bench groups.
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchGroupSummarySerializersBenchGroupSummaryListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics Bench Group
  /api/labs/analytics/booked-vs-used:
    get:
      operationId: labs_analytics_booked_vs_used_retrieve
      description: Reserved bench hours compared with recorded session hours for a
        date window.
      parameters:
      - in: query
        name: from_date_time
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: to_date_time
        schema:
          type: string
          format: date-time
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookedVsUsedAnalyticsSerializersBookedVsUsedDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics Booked Vs Used
  /api/labs/analytics/booking:
    get:
      operationId: labs_analytics_booking_retrieve
      description: Aggregate booking count and trend or bucketed changelog statistics.
      parameters:
      - in: query
        name: date_after
        schema:
          type: string
          format: date
        description: First local day to include (YYYY-MM-DD, inclusive). Requires
          `unit`. For `unit=day` the default is 30 days before `date_before`.
      - in: query
        name: date_before
        schema:
          type: string
          format: date
        description: Local day to stop before (YYYY-MM-DD, exclusive). Requires `unit`.
          For `unit=day` the default is tomorrow, so today is included; a range covers
          at most 366 days.
      - in: query
        name: unit
        schema:
          enum:
          - day
          - week
          - month
          - quarter
          - year
          type: string
          minLength: 1
        description: '* `day` - day

          * `week` - week

          * `month` - month

          * `quarter` - quarter

          * `year` - year'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCountAnalyticsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics Booking
  /api/labs/analytics/dashboard-summary:
    get:
      operationId: labs_analytics_dashboard_summary_retrieve
      description: Deprecated alias for dashboard summary. Use /api/labs/dashboard/summary
        instead.
      parameters:
      - in: query
        name: from_date_time
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: to_date_time
        schema:
          type: string
          format: date-time
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryAnalyticsSerializersDashboardSummaryDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics Dashboard Summary
  /api/labs/analytics/equipment-availability:
    get:
      operationId: labs_analytics_equipment_availability_retrieve
      description: Equipment uptime and outage counts derived from status history
        for a date window.
      parameters:
      - in: query
        name: from_date_time
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: to_date_time
        schema:
          type: string
          format: date-time
        required: true
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentAvailabilityAnalyticsSerializersEquipmentAvailabilityDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics Equipment Availability
  /api/labs/analytics/finance/expense-type-breakdown:
    get:
      operationId: labs_analytics_finance_expense_type_breakdown_retrieve
      description: 'Actual cash flow by expense type and source; purchases use procurement.


        No purchase commitment/allocation reporting. Same inclusive month window,

        timezone boundaries, signed refunds, access, no-FX and no-dedup semantics.

        All finance reads share 30 requests/minute per user, or per IP for API keys.

        Invalid queries return invalid_query (400); exhausted budgets return rate_limited
        (429).'
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          minLength: 1
        description: Explicit three-letter currency; no FX conversion.
        required: true
      - in: query
        name: end_month
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        description: Inclusive last calendar month (YYYY-MM); maximum 24 months.
        required: true
      - in: query
        name: start_month
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        description: Inclusive first calendar month (YYYY-MM).
        required: true
      - in: query
        name: timezone
        schema:
          type: string
          default: UTC
          maxLength: 100
          minLength: 1
        description: IANA zone for procurement timestamps and midnight boundaries.
          Expense paid_at dates are not shifted.
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - financeApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceBreakdownAnalyticsSerializersFinanceBreakdownDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
      summary: Get Analytics Finance Expense Type Breakdown
  /api/labs/analytics/finance/monthly-trends:
    get:
      operationId: labs_analytics_finance_monthly_trends_retrieve
      description: 'Monthly actual cash-flow series, zero-filled, with separate source
        totals.


        Same currency, access, signed-refund and timezone rules as finance summary.

        Inclusive calendar-month window is bounded to 24 months; no deduplication/FX.

        All finance reads share 30 requests/minute per user, or per IP for API keys.

        Invalid queries return invalid_query (400); exhausted budgets return rate_limited
        (429).'
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          minLength: 1
        description: Explicit three-letter currency; no FX conversion.
        required: true
      - in: query
        name: end_month
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        description: Inclusive last calendar month (YYYY-MM); maximum 24 months.
        required: true
      - in: query
        name: start_month
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        description: Inclusive first calendar month (YYYY-MM).
        required: true
      - in: query
        name: timezone
        schema:
          type: string
          default: UTC
          maxLength: 100
          minLength: 1
        description: IANA zone for procurement timestamps and midnight boundaries.
          Expense paid_at dates are not shifted.
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - financeApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceMonthlyTrendsAnalyticsSerializersFinanceMonthlyTrendsDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
      summary: Get Analytics Finance Monthly Trends
  /api/labs/analytics/finance/summary:
    get:
      operationId: labs_analytics_finance_summary_retrieve
      description: 'Actual cash flow, no commitments, allocations, FX or deduplication.


        Calendar months are inclusive; the next month''s local midnight is exclusive.

        Date-only expense payments retain their calendar date. Procurement instants

        are bucketed in the requested zone. Refunds are signed and net is not clamped.

        Access: authenticated user or valid API key, as with existing finance reads.

        All finance reads share 30 requests/minute per user, or per IP for API keys.

        Invalid queries return invalid_query (400); exhausted budgets return rate_limited
        (429).'
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          maxLength: 3
          pattern: ^[A-Z]{3}$
          minLength: 1
        description: Explicit three-letter currency; no FX conversion.
        required: true
      - in: query
        name: end_month
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        description: Inclusive last calendar month (YYYY-MM); maximum 24 months.
        required: true
      - in: query
        name: start_month
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        description: Inclusive first calendar month (YYYY-MM).
        required: true
      - in: query
        name: timezone
        schema:
          type: string
          default: UTC
          maxLength: 100
          minLength: 1
        description: IANA zone for procurement timestamps and midnight boundaries.
          Expense paid_at dates are not shifted.
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - financeApiKey: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceSummaryAnalyticsSerializersFinanceSummaryDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceProblemResponse'
          description: ''
      summary: Get Analytics Finance Summary
