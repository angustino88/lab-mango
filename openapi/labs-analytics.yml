          type: string
          minLength: 1
        description: '* `day` - day

          * `week` - week

          * `month` - month

          * `quarter` - quarter

          * `year` - year'
      tags:
      - Analytics
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabCountAnalyticsResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Analytics Lab Count
  /api/labs/analytics/lab-efficiency:
