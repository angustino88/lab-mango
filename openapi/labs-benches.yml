components:
  schemas:
    Bench:
      type: object
      description: Base model serializer that automatically exposes created_at and
        updated_at from TimeStampedModel.
      properties:
        id:
          type: integer
          readOnly: true
        uid:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        group:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        department:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        owner:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        remark:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        image_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        bench_group:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
        documentation_url:
          type: string
          format: uri
          readOnly: true
        setup_location:
          allOf:
          - $ref: '#/components/schemas/LabsUIDNamedReference'
          readOnly: true
          nullable: true
        station_slot:
          allOf:
          - $ref: '#/components/schemas/LabsNamedReference'
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          nullable: true
          readOnly: true
          description: 'Deprecated: use lifecycle_status, condition, availability
            and activity_status.'
        lifecycle_status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        condition:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        availability:
          allOf:
          - $ref: '#/components/schemas/LabsAvailability'
          readOnly: true
        activity_status:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        criticality:
          type: string
          readOnly: true
        requested_power_w:
          type: integer
          readOnly: true
          nullable: true
        requested_load_kg:
          type: integer
          readOnly: true
          nullable: true
        requested_cooling_w:
          type: integer
          readOnly: true
          nullable: true
        required_utilities:
          readOnly: true
        commissioning_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        last_inspected_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        next_inspection_due_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        setup_location_path:
          type: string
          readOnly: true
        is_favorite:
          type: boolean
          readOnly: true
        equipment_count:
          type: integer
          readOnly: true
        equipment_url:
          type: string
          readOnly: true
      required:
      - activity_status
      - availability
      - bench_group
      - commissioning_date
      - condition
      - created_at
      - criticality
      - department
      - description
      - documentation_url
      - equipment_count
      - equipment_url
      - group
      - id
      - image
      - image_url
      - is_favorite
      - last_inspected_at
      - lifecycle_status
      - name
      - next_inspection_due_at
      - owner
