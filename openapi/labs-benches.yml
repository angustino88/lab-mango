      - sku
    CatalogOptionList:
      type: object
      description: Enveloped list of selector options.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CatalogOption'
          readOnly: true
      required:
      - data
    FilterMetadata:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            additionalProperties: {}
        combination:
          type: string
        multi_value_combination:
          type: string
        separator:
          type: string
        search:
          type: object
          additionalProperties: {}
          nullable: true
        ordering:
          type: array
          items:
            type: string
        default_ordering:
          type: array
          items:
            type: string
      required:
      - combination
      - default_ordering
      - filters
      - multi_value_combination
      - ordering
      - search
      - separator
    LabsAvailability:
      type: object
      description: 'Computed ``availability``: problems pass down from room to station
        to bench (never stored).'
      properties:
        value:
          allOf:
          - $ref: '#/components/schemas/ValueEnum'
          readOnly: true
        blocked_by:
          allOf:
          - $ref: '#/components/schemas/LabsAvailabilitySource'
          readOnly: true
          nullable: true
          description: The resource that blocks.
        condition:
          type: string
          readOnly: true
          nullable: true
        reason:
          type: string
          readOnly: true
          nullable: true
          description: Lifecycle status, or the downtime reason, of blocked_by.
      required:
      - blocked_by
      - condition
      - reason
      - value
    LabsAvailabilitySource:
      type: object
      properties:
        type:
          type: string
          readOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - type
    LabsChoiceReference:
      type: object
      description: Standard `{value, label}` representation for enum and lifecycle
        choices.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    LabsNamedReference:
      type: object
      description: Compact `{id, name}` object representation of a related entity.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    LabsUIDNamedReference:
      type: object
      description: Compact `{id, uid, name}` object representation when target defines
        a UUID.
      properties:
        id:
          type: integer
          readOnly: true
        uid:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
      - uid
    LifecycleStatusEnum:
      enum:
      - planned
      - in_service
      - retired
      type: string
      description: '* `planned` - Planned

        * `in_service` - In service

        * `retired` - Retired'
    PatchedBenchPlacement:
      type: object
      description: Preserve the benches module's established strict-write helper.
      properties:
        setup_location_id:
          type: integer
          minimum: 1
          nullable: true
        station_slot_id:
          type: integer
          minimum: 1
          nullable: true
    PatchedBenchReferenceWrite:
      type: object
      description: Preserve the benches module's established strict-write helper.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
        is_active:
          type: boolean
    PatchedBenchUpdate:
      type: object
      description: Preserve the benches module's established strict-write helper.
      properties:
        sku:
          type: string
          maxLength: 255
        name:
          type: string
          maxLength: 255
        department_id:
          type: integer
          minimum: 1
          nullable: true
        group_id:
          type: integer
          minimum: 1
          nullable: true
        owner_id:
          type: integer
          minimum: 1
          nullable: true
        remark:
          type: string
          maxLength: 255
        image:
          type: string
          format: uri
          nullable: true
        type_id:
          type: integer
          minimum: 1
          nullable: true
        bench_group_id:
          type: integer
          minimum: 1
          nullable: true
        description:
          type: string
        documentation_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        setup_location_id:
          type: integer
          minimum: 1
          nullable: true
        station_slot_id:
          type: integer
          minimum: 1
          nullable: true
        criticality:
          type: string
          maxLength: 32
        requested_power_w:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        requested_load_kg:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        requested_cooling_w:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        required_utilities:
          type: object
          additionalProperties: {}
        commissioning_date:
          type: string
          format: date
          nullable: true
        last_inspected_at:
          type: string
          format: date-time
          nullable: true
        next_inspection_due_at:
          type: string
          format: date-time
          nullable: true
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    ResourceImage:
      type: object
      properties:
        image_url:
          type: string
          format: uri
          readOnly: true
          nullable: true
      required:
      - image_url
    ResourceImageResourceImagesResourceImageDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/ResourceImage'
      required:
      - data
    ResourceImageUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG, GIF or WebP, at most 5 MB. The type is detected
            from the content.
      required:
      - file
    SummaryStatus:
      type: object
      properties:
        value:
          type: string
        label:
          type: string
      required:
      - label
      - value
    SummaryStatusCount:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/SummaryStatus'
        resource_count:
          type: integer
          minimum: 0
      required:
      - resource_count
      - status
    ValueEnum:
      enum:
      - available
      - unavailable
      type: string
      description: '* `available` - available

        * `unavailable` - unavailable'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Benches
  description: Benches endpoints
