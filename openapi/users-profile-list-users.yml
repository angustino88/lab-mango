openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/users:
    get:
      operationId: users_retrieve
      description: List visible system users with optional username filtering.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: username
        schema:
          type: string
          minLength: 1
      tags:
      - User Profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersSerializersUserPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Users
  /api/users/{id}:
    get:
      operationId: users_retrieve_by_id
      description: Retrieve or partially update a specific user profile.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - User Profiles
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSerializersUserDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Users by ID
    patch:
      operationId: users_partial_update_by_id
      description: Retrieve or partially update a specific user profile.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - User Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patched_UpdateUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Patched_UpdateUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Patched_UpdateUser'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSerializersUserDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Update Users by ID
components:
  schemas:
    Patched_UpdateUser:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 255
        name:
          type: string
          title: Name of User
          maxLength: 255
        department:
          type: string
          maxLength: 255
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        display_name:
          type: string
          maxLength: 255
        avatar_url:
          type: string
          nullable: true
          readOnly: true
      required:
      - avatar_url
      - id
      - username
    UserSerializersUserDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/User'
      required:
      - data
    UsersSerializersUserPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/UsersSerializersUserPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
      required:
      - data
      - meta
    UsersSerializersUserPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    UsersSerializersUserPaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/UsersSerializersUserPagination'
      required:
      - pagination
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: User Profiles
  description: User Profiles endpoints
