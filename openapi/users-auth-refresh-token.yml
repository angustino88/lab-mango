openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/refresh-token:
    post:
      operationId: refresh_token_create
      description: 'Rotate the HttpOnly refresh cookie and issue a renewed access
        token.


        No DRF authenticator or Bearer token is required. The refresh token is read

        only from its cookie, never the request body. A valid CSRF cookie/token

        (normally the X-CSRFToken header) and Django CSRF origin/referer checks apply.

        Missing or invalid refresh cookies return 401 after CSRF verification.'
      tags:
      - User Authentication
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenSerializerRefreshTokenResponseDetailResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      security: []
      summary: Refresh Token
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    RefreshTokenResponse:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    RefreshTokenSerializerRefreshTokenResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/RefreshTokenResponse'
      required:
      - data
servers:
- url: ''
  description: Local Development Server
tags:
- name: User Authentication
  description: User Authentication endpoints
