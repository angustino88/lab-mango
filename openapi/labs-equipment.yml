          description: The requested page does not exist (page beyond the last page).
      summary: Get Resource Groups
  /api/labs/resource-groups/{group_id}:
    get:
      operationId: labs_resource_groups_retrieve_by_group_id
      description: Equipment specialization of the shared feature API foundation.
      parameters:
      - in: path
        name: group_id
        schema:
          type: integer
        required: true
      tags:
      - Equipment
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceGroupCatalogDetailSerializersResourceGroupCatalogDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Resource Groups by Group ID
  /api/labs/resource-groups/options:
    get:
      operationId: labs_resource_groups_options_retrieve
      description: 'Shared base view for dropdown selector endpoints (ADR 002).


        Validates query parameters, enforces the size class and result cap,

        calls the feature''s query selector, handles ETag generation / 304 Not Modified,

        and returns {"data": [{"id": ..., "sku": ..., "name": ...}]}.'
      parameters:
      - in: query
        name: department_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: include_ids
        schema:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 50
          uniqueItems: true
        description: Comma-separated positive integers (at most 50) of retired rows
          to include.
        style: form
        explode: false
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Search text (1 to 100 characters).
      tags:
      - Equipment
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOptionList'
          description: Standard selector options list
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Invalid selector query parameters (invalid_query) or result
            cap exceeded (too_many_results).
        '304':
          description: Not modified
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Access denied by the existing API-key or authenticated-user
            permission policy.
      x-owner: equipment
      summary: Get Resource Groups Options
