          type: string
          description: Firmware currently installed on this unit.
          maxLength: 255
        power_draw_w:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Nameplate power consumption in watts.
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        warranty_until:
          type: string
          format: date
          nullable: true
        calibration_required:
          type: boolean
          description: History and due dates are kept as ResourceServiceRecord (kind=calibration).
        dimensions:
          description: Keys length_mm, width_mm, height_mm.
        kind_id:
          type: integer
        type_id:
          type: integer
          nullable: true
        manufacturer_id:
          type: integer
          nullable: true
        product_model_id:
          type: integer
          nullable: true
        owner_id:
          type: integer
          nullable: true
        department_id:
          type: integer
          nullable: true
          description: Owning department.
        group_id:
          type: integer
          nullable: true
          description: Owning team; must belong to the selected department.
        storage_room_id:
          type: integer
          nullable: true
          description: Where the asset is kept while it is In-storage.
        material_id:
          type: integer
          nullable: true
