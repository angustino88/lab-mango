openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/departments:
    get:
      operationId: labs_departments_retrieve
      description: Equipment specialization of the shared feature API foundation.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      tags:
      - Equipment
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCatalogListSerializersDepartmentPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Departments
  /api/labs/departments/{department_id}:
    get:
      operationId: labs_departments_retrieve_by_department_id
      description: Equipment specialization of the shared feature API foundation.
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - Equipment
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCatalogDetailSerializersDepartmentDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Departments by Department ID
  /api/labs/departments/options:
    get:
      operationId: labs_departments_options_retrieve
      description: 'Shared base view for dropdown selector endpoints (ADR 002).


        Validates query parameters, enforces the size class and result cap,

        calls the feature''s query selector, handles ETag generation / 304 Not Modified,

        and returns {"data": [{"id": ..., "sku": ..., "name": ...}]}.'
      parameters:
      - in: query
        name: include_ids
        schema:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 50
          uniqueItems: true
        description: Comma-separated positive integers (at most 50) of retired rows
          to include.
        style: form
        explode: false
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Search text (1 to 100 characters).
      tags:
      - Equipment
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOptionList'
          description: Standard selector options list
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Invalid selector query parameters (invalid_query) or result
            cap exceeded (too_many_results).
        '304':
          description: Not modified
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Access denied by the existing API-key or authenticated-user
            permission policy.
      x-owner: equipment
      summary: Get Departments Options
  /api/labs/equipment:
    get:
      operationId: labs_equipment_retrieve
      description: List every equipment unit (filter by ``category``), or create one.
      parameters:
      - in: query
        name: assigned
        schema:
          type: boolean
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: condition
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - in: query
        name: customer_id
        schema:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          format: int64
      - in: query
        name: department_id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: group_id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: kind
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: lifecycle_state
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: loan_overdue
        schema:
          type: boolean
      - in: query
        name: manufacturer
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: material_id
        schema:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          format: int64
      - in: query
        name: on_loan
        schema:
          type: boolean
      - in: query
        name: ordering
        schema:
          type: string
          minLength: 1
      - in: query
        name: owner_id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: product_model_id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: protocol_id
        schema:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          format: int64
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: resolution_id
        schema:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          format: int64
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
      - in: query
        name: size_id
        schema:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          format: int64
      - in: query
        name: status
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: technical_user_id
        schema:
          type: integer
          maximum: 9007199254740991
          minimum: 1
          format: int64
      - in: query
        name: type
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      tags:
      - Equipment
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCollectionAPIViewCollectionEquipmentItemPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Equipment
    post:
      operationId: labs_equipment_create
      description: List every equipment unit (filter by ``category``), or create one.
      tags:
      - Equipment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EquipmentCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EquipmentCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCollectionAPIViewCollectionEquipmentDetailDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Equipment
