openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/downtimes:
    get:
      operationId: labs_downtimes_retrieve
      description: Coordinators and administrators (``LABS_STAFF_ACCESS``), like every
        other resource write.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: resource_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: resource_type
        schema:
          enum:
          - room
          - station
          - bench
          - equipment
          type: string
          minLength: 1
        description: '* `room` - room

          * `station` - station

          * `bench` - bench

          * `equipment` - equipment'
      - in: query
        name: state
        schema:
          enum:
          - scheduled
          - current
          - ended
          - cancelled
          type: string
          minLength: 1
        description: '* `scheduled` - scheduled

          * `current` - current

          * `ended` - ended

          * `cancelled` - cancelled'
      tags:
      - Downtime
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowntimeListSerializersDowntimePaginatedResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Downtimes
    post:
      operationId: labs_downtimes_create
      description: Coordinators and administrators (``LABS_STAFF_ACCESS``), like every
        other resource write.
      tags:
      - Downtime
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DowntimeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DowntimeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DowntimeCreate'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowntimeCreateSerializersDowntimeDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Downtimes
  /api/labs/downtimes/{downtime_id}:
    get:
      operationId: labs_downtimes_retrieve_by_downtime_id
      description: Coordinators and administrators (``LABS_STAFF_ACCESS``), like every
        other resource write.
      parameters:
      - in: path
        name: downtime_id
        schema:
          type: integer
        required: true
      tags:
      - Downtime
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowntimeDetailSerializersDowntimeDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Downtimes by Downtime ID
  /api/labs/downtimes/{downtime_id}/actions/cancel:
    post:
      operationId: labs_downtimes_actions_cancel_create_by_downtime_id
      description: Coordinators and administrators (``LABS_STAFF_ACCESS``), like every
        other resource write.
      parameters:
      - in: path
        name: downtime_id
        schema:
          type: integer
        required: true
      tags:
      - Downtime
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowntimeCancelSerializersDowntimeDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Cancel Downtimes by Downtime ID
  /api/labs/downtimes/{downtime_id}/actions/end:
    post:
      operationId: labs_downtimes_actions_end_create_by_downtime_id
      description: Coordinators and administrators (``LABS_STAFF_ACCESS``), like every
        other resource write.
      parameters:
      - in: path
        name: downtime_id
        schema:
          type: integer
        required: true
      tags:
      - Downtime
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DowntimeEndSerializersDowntimeDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: End Downtimes by Downtime ID
components:
  schemas:
    Downtime:
      type: object
      description: Base model serializer that automatically exposes created_at and
        updated_at from TimeStampedModel.
      properties:
        id:
          type: integer
          readOnly: true
        resource:
          allOf:
          - $ref: '#/components/schemas/LabsDowntimeResource'
          readOnly: true
        condition:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/LabsChoiceReference'
          readOnly: true
        state:
          allOf:
          - $ref: '#/components/schemas/DowntimeStateEnum'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Empty while the end is not known.
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        notes:
          type: string
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/LabsResourceOwner'
          readOnly: true
          nullable: true
        ended_by:
          allOf:
          - $ref: '#/components/schemas/LabsResourceOwner'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - cancelled_at
      - condition
      - created_at
      - ended_by
      - ends_at
      - id
      - kind
      - notes
      - reason
      - resource
      - starts_at
      - state
      - updated_at
    DowntimeCancelSerializersDowntimeDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Downtime'
      required:
      - data
    DowntimeCreate:
      type: object
      description: Reject unsupported keys and return a stable error when SKU is supplied
        on update.
      properties:
        resource_type:
          $ref: '#/components/schemas/DowntimeResourceTypeEnum'
        resource_id:
          type: integer
          minimum: 1
        condition:
          $ref: '#/components/schemas/DowntimeCreateConditionEnum'
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          default: other
        kind:
          nullable: true
          description: 'Defaults to planned for a window that starts later, otherwise
            unplanned.


            * `planned` - Planned

            * `unplanned` - Unplanned'
          oneOf:
          - $ref: '#/components/schemas/KindEnum'
          - $ref: '#/components/schemas/NullEnum'
        starts_at:
          type: string
          format: date-time
          nullable: true
          description: 'Default: now.'
        ends_at:
          type: string
          format: date-time
          nullable: true
          description: Empty while the end is not known.
        notes:
          type: string
          default: ''
          maxLength: 2000
        cancel_conflicting_bookings:
          type: boolean
          default: false
          description: Cancel reserved and in-progress bookings that overlap the window,
            in the same transaction.
      required:
      - condition
      - resource_id
      - resource_type
    DowntimeCreateConditionEnum:
      enum:
      - in_maintenance
      - out_of_service
      type: string
      description: '* `in_maintenance` - In maintenance

        * `out_of_service` - Out of service'
    DowntimeCreateSerializersDowntimeDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Downtime'
      required:
      - data
    DowntimeDetailSerializersDowntimeDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Downtime'
      required:
      - data
    DowntimeEndSerializersDowntimeDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Downtime'
      required:
      - data
    DowntimeListSerializersDowntimePaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/DowntimeListSerializersDowntimePaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Downtime'
      required:
      - data
      - meta
    DowntimeListSerializersDowntimePagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    DowntimeListSerializersDowntimePaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/DowntimeListSerializersDowntimePagination'
      required:
      - pagination
    DowntimeResourceTypeEnum:
      enum:
      - room
      - station
      - bench
      - equipment
      type: string
      description: '* `room` - room

        * `station` - station

        * `bench` - bench

        * `equipment` - equipment'
    DowntimeStateEnum:
      enum:
      - scheduled
      - current
      - ended
      - cancelled
      type: string
      description: '* `scheduled` - scheduled

        * `current` - current

        * `ended` - ended

        * `cancelled` - cancelled'
    KindEnum:
      enum:
      - planned
      - unplanned
      type: string
      description: '* `planned` - Planned

        * `unplanned` - Unplanned'
    LabsChoiceReference:
      type: object
      description: Standard `{value, label}` representation for enum and lifecycle
        choices.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    LabsDowntimeResource:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/DowntimeResourceTypeEnum'
          readOnly: true
        id:
          type: integer
          readOnly: true
      required:
      - id
      - type
    LabsResourceOwner:
      type: object
      description: Base model serializer that automatically exposes created_at and
        updated_at from TimeStampedModel.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        display_name:
          type: string
          maxLength: 255
      required:
      - id
      - username
    NullEnum:
      enum:
      - null
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    ReasonEnum:
      enum:
      - maintenance
      - fault
      - calibration
      - safety_hold
      - renovation
      - other
      type: string
      description: '* `maintenance` - Maintenance

        * `fault` - Fault

        * `calibration` - Calibration

        * `safety_hold` - Safety hold

        * `renovation` - Renovation

        * `other` - Other'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Downtime
  description: Downtime endpoints
