openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/aad-login:
    post:
      operationId: aad_login_create
      description: 'Validate a body-supplied Azure AD ID token without a DRF authenticator.


        The body carries the ID token and the browser''s ``nonce_secret``; the token''s
        ``nonce`` must equal

        base64url(SHA-256(nonce_secret)), the token must be recent, and each nonce
        is accepted once.

        Requires a valid CSRF cookie/token (``GET /api/csrf-token``; normally the
        X-CSRFToken header).

        Django CSRF origin/referer checks apply. Success issues an HttpOnly refresh
        cookie.

        Explicit public OpenAPI security does not exempt this operation from CSRF.'
      tags:
      - User Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AADLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AADLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AADLogin'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AADLoginSerializerAADLoginResponseDetailResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      security: []
      summary: Azure AD Login
  /api/csrf-token:
    get:
      operationId: csrf_token_retrieve
      description: Issue the CSRF cookie and token that login, refresh and logout
        require. Writes nothing.
      tags:
      - User Authentication
      security: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRFTokenSerializerCSRFTokenResponseDetailResponse'
          description: ''
      summary: Get Csrf Token
components:
  schemas:
    AADLogin:
      type: object
      properties:
        id_token:
          type: string
          writeOnly: true
          maxLength: 16384
        nonce_secret:
          type: string
          writeOnly: true
          description: The browser's random secret; the ID token's nonce is base64url(SHA-256(nonce_secret)).
          maxLength: 128
          minLength: 43
      required:
      - id_token
      - nonce_secret
    AADLoginResponse:
      type: object
      properties:
        username:
          type: string
        access:
          type: string
        is_active:
          type: boolean
        csrf_token:
          type: string
      required:
      - access
      - is_active
      - username
    AADLoginSerializerAADLoginResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/AADLoginResponse'
      required:
      - data
    CSRFTokenResponse:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    CSRFTokenSerializerCSRFTokenResponseDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/CSRFTokenResponse'
      required:
      - data
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
servers:
- url: ''
  description: Local Development Server
tags:
- name: User Authentication
  description: User Authentication endpoints
