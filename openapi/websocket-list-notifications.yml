openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/notifications:
    get:
      operationId: notifications_list
      description: List visible, unexpired notifications in data with meta.pagination
        (count, page, page_size, next, previous). Page size defaults to 25 and is
        limited to 100. An invalid page_size returns 400; a nonexistent or invalid
        page returns 404. An unknown or repeated query parameter, or a since / user_id
        that is not a non-negative integer, returns 400 invalid_query.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
        description: A page number within the paginated result set.
      - in: query
        name: page_size
        schema:
          type: integer
          minimum: 1
          maximum: 100
        description: Number of results to return per page.
      - in: query
        name: since
        schema:
          type: integer
          minimum: 0
        description: 'Reconnection cursor: return only notifications whose id is greater
          than this value. Pass the highest id already received.'
      - in: query
        name: user_id
        schema:
          type: integer
          minimum: 0
        description: 'Return only notifications targeted at this user; broadcasts
          are excluded. Only the caller''s own id is honoured: any other id returns
          an empty page.'
      tags:
      - Websocket Notifications
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSerializerNotificationPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: List Notifications
    post:
      operationId: notifications_create
      description: List unread notifications or publish a real-time event notification.
      tags:
      - Websocket Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationWrite'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSerializerNotificationDetailResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Notifications
components:
  schemas:
    Choice:
      type: object
      description: ENU-1 ``{value, label}``.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    MessageTypeEnum:
      enum:
      - success
      - error
      - warning
      - info
      - announcement
      type: string
      description: '* `success` - Success

        * `error` - Error

        * `warning` - Warning

        * `info` - Info

        * `announcement` - Announcement'
    Notification:
      type: object
      description: Read shape (RW-1, ENU-1, NAM-3, REL-3).
      properties:
        id:
          type: integer
          readOnly: true
        message:
          type: string
          readOnly: true
        details:
          type: string
          readOnly: true
          nullable: true
        message_type:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        target_user:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - details
      - expires_at
      - id
      - message
      - message_type
      - target_user
      - updated_at
    NotificationSerializerNotificationDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Notification'
      required:
      - data
    NotificationSerializerNotificationPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/NotificationSerializerNotificationPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
      required:
      - data
      - meta
    NotificationSerializerNotificationPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    NotificationSerializerNotificationPaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/NotificationSerializerNotificationPagination'
      required:
      - pagination
    NotificationWrite:
      type: object
      description: Write shape (RW-1); the target user is not writable here.
      properties:
        message:
          type: string
          maxLength: 255
        details:
          type: string
          nullable: true
          maxLength: 255
        message_type:
          $ref: '#/components/schemas/MessageTypeEnum'
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    UserReference:
      type: object
      description: REL-3 user relation ``{id, name}``; duck-typed so any feature may
        use it without importing users.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Websocket Notifications
  description: Websocket Notifications endpoints
