openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/benches/{resource_id}/mapping:
    get:
      operationId: labs_benches_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected bench.
      summary: Get bench placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: license_assignments_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: licenses_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      - in: query
        name: room_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: rooms_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: station_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: stations_cursor
        schema:
          type: string
          minLength: 1
      tags:
      - Resource Mappings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMappingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
  /api/labs/equipment/{resource_id}/mapping:
    get:
      operationId: labs_equipment_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected equipment.
      summary: Get equipment placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: license_assignments_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: licenses_cursor
        schema:
