      - in: query
        name: room_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: rooms_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: station_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: stations_cursor
        schema:
          type: string
          minLength: 1
      tags:
      - Resource Mappings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMappingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
  /api/labs/rooms/{resource_id}/mapping:
    get:
      operationId: labs_rooms_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected room.
      summary: Get room placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: license_assignments_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: licenses_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      - in: query
        name: room_slots_cursor
        schema:
