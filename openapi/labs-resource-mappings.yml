              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
  /api/labs/stations/{resource_id}/mapping:
    get:
      operationId: labs_stations_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected station.
      summary: Get station placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
