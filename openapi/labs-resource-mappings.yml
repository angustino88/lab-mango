openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/benches/{resource_id}/mapping:
    get:
      operationId: labs_benches_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected bench.
      summary: Get bench placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: license_assignments_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: licenses_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      - in: query
        name: room_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: rooms_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: station_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: stations_cursor
        schema:
          type: string
          minLength: 1
      tags:
      - Resource Mappings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMappingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
  /api/labs/equipment/{resource_id}/mapping:
    get:
      operationId: labs_equipment_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected equipment.
      summary: Get equipment placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: license_assignments_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: licenses_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      - in: query
        name: room_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: rooms_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: station_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: stations_cursor
        schema:
          type: string
          minLength: 1
      tags:
      - Resource Mappings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMappingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
  /api/labs/resource-mappings:
    get:
      operationId: labs_resource_mappings_retrieve
      description: One page of benches (ordered by SKU) with their station, room,
        slots, placed units and licenses, in the flat collection shape of the mapping
        reads. Filters and search run on the server; meta.summary counts the whole
        filtered set (before state).
      summary: List bench mappings
      parameters:
      - in: query
        name: bench_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: equipment_category_id
        schema:
          type: integer
          minimum: 1
        description: Benches with at least one unit of this equipment category.
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Matches the SKU or name of the bench, its station, its room or
          a unit placed on it.
      - in: query
        name: room_id
        schema:
          type: integer
          minimum: 1
      - in: query
        name: state
        schema:
          enum:
          - fully_mapped
          - needs_equipment
          - needs_placement
          type: string
          minLength: 1
        description: 'needs_placement: no station in a room. needs_equipment: placed,
          no units. fully_mapped: both.


          * `fully_mapped` - Fully mapped

          * `needs_equipment` - Needs equipment

          * `needs_placement` - Needs placement'
      - in: query
        name: station_id
        schema:
          type: integer
          minimum: 1
      tags:
      - Resource Mappings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchMappingListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
  /api/labs/rooms/{resource_id}/mapping:
    get:
      operationId: labs_rooms_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected room.
      summary: Get room placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: license_assignments_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: licenses_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      - in: query
        name: room_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: rooms_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: station_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: stations_cursor
        schema:
          type: string
          minLength: 1
      tags:
      - Resource Mappings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMappingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
  /api/labs/stations/{resource_id}/mapping:
    get:
      operationId: labs_stations_mapping_retrieve_by_resource_id
      description: Returns flat graphic-only placement context for the selected station.
      summary: Get station placement mapping
      parameters:
      - in: query
        name: benches_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: equipment_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: license_assignments_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: licenses_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
      - in: path
        name: resource_id
        schema:
          type: integer
        required: true
      - in: query
        name: room_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: rooms_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: station_slots_cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: stations_cursor
        schema:
          type: string
          minLength: 1
      tags:
      - Resource Mappings
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceMappingResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
components:
  schemas:
    BenchMappingListMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/BenchMappingPage'
        summary:
          $ref: '#/components/schemas/BenchMappingSummary'
      required:
      - pagination
      - summary
    BenchMappingListResponse:
      type: object
      description: A page of benches (``data.benches``) and only the rows they reference
        in the other collections.
      properties:
        data:
          $ref: '#/components/schemas/ResourceMappingData'
        meta:
          $ref: '#/components/schemas/BenchMappingListMeta'
      required:
      - data
      - meta
    BenchMappingPage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    BenchMappingSummary:
      type: object
      properties:
        benches:
          type: integer
          minimum: 0
          description: Benches matching the filters (state not applied).
        fully_mapped:
          type: integer
          minimum: 0
        needs_equipment:
          type: integer
          minimum: 0
        needs_placement:
          type: integer
          minimum: 0
        equipment:
          type: integer
          minimum: 0
          description: Units placed on those benches.
      required:
      - benches
      - equipment
      - fully_mapped
      - needs_equipment
      - needs_placement
    MappingBench:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        setup_location_id:
          type: integer
          nullable: true
        station_slot_id:
          type: integer
          nullable: true
        visual_model_id:
          type: integer
          nullable: true
          description: 3D library model shown for this resource, after catalog defaults.
      required:
      - id
      - name
      - setup_location_id
      - sku
      - station_slot_id
      - uid
      x-embedded-resource: true
    MappingConditions:
      type: object
      description: Current conditions from fresh telemetry placed in the room or station;
        null when nothing reports.
      properties:
        temperature_c:
          type: number
          format: double
          nullable: true
          description: Mean of current temperature channels.
        humidity_percent:
          type: number
          format: double
          nullable: true
          description: Mean of current humidity channels.
        power_w:
          type: number
          format: double
          nullable: true
          description: Sum of current power channels.
        observed_at:
          type: string
          format: date-time
          nullable: true
          description: Newest reading included.
        channel_count:
          type: integer
      required:
      - channel_count
      - humidity_percent
      - observed_at
      - power_w
      - temperature_c
    MappingEquipment:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/MappingEquipmentCategory'
          nullable: true
        product_model:
          allOf:
          - $ref: '#/components/schemas/MappingEquipmentCategory'
          nullable: true
        bench_id:
          type: integer
          nullable: true
        bench_assignment:
          allOf:
          - $ref: '#/components/schemas/MappingEquipmentAssignment'
          nullable: true
        visual_model_id:
          type: integer
          nullable: true
          description: 3D library model shown for this resource, after catalog defaults.
      required:
      - bench_assignment
      - bench_id
      - category
      - id
      - name
      - sku
      - uid
      x-embedded-resource: true
    MappingEquipmentAssignment:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
        position:
          type: integer
        is_monitored:
          type: boolean
        assigned_at:
          type: string
          format: date-time
      required:
      - assigned_at
      - id
      - is_monitored
      - position
      - role
      x-embedded-resource: true
    MappingEquipmentCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    MappingLicense:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        category:
          allOf:
          - $ref: '#/components/schemas/MappingLicenseCategory'
          nullable: true
      required:
      - category
      - id
      - name
      - sku
      - uid
      x-embedded-resource: true
    MappingLicenseAssignment:
      type: object
      properties:
        id:
          type: integer
        equipment_id:
          type: integer
        license_id:
          type: integer
        assigned_at:
          type: string
          format: date-time
      required:
      - assigned_at
      - equipment_id
      - id
      - license_id
      x-embedded-resource: true
    MappingLicenseCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
      required:
      - id
      - name
    MappingPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page_size:
          type: integer
          minimum: 1
        next_cursor:
          type: string
          nullable: true
        previous_cursor:
          type: string
          nullable: true
      required:
      - count
      - next_cursor
      - page_size
      - previous_cursor
    MappingRackItem:
      type: object
      properties:
        equipment_id:
          type: integer
        sku:
          type: string
        name:
          type: string
        category:
          type: string
          nullable: true
        power_draw_w:
          type: integer
          nullable: true
        rack_unit:
          type: integer
        rack_unit_height:
          type: integer
        rack_face:
          type: string
      required:
      - category
      - equipment_id
      - name
      - power_draw_w
      - rack_face
      - rack_unit
      - rack_unit_height
      - sku
    MappingRoom:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        layout_rows:
          type: integer
          nullable: true
        layout_columns:
          type: integer
          nullable: true
        length_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        width_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
        conditions:
          allOf:
          - $ref: '#/components/schemas/MappingConditions'
          nullable: true
      required:
      - id
      - layout_columns
      - layout_rows
      - name
      - sku
      - uid
      x-embedded-resource: true
    MappingRoomSlot:
      type: object
      properties:
        id:
          type: integer
        room_id:
          type: integer
        row_index:
          type: integer
        col_index:
          type: integer
        slot_code:
          type: string
        x_mm:
          type: integer
          nullable: true
        y_mm:
          type: integer
          nullable: true
        width_mm:
          type: integer
          nullable: true
        depth_mm:
          type: integer
          nullable: true
        orientation_degrees:
          type: integer
        slot_type:
          type: string
          description: station, storage, aisle, safety, utility or reserved.
        status:
          type: string
          description: usable, blocked or retired.
      required:
      - col_index
      - depth_mm
      - id
      - orientation_degrees
      - room_id
      - row_index
      - slot_code
      - width_mm
      - x_mm
      - y_mm
      x-embedded-resource: true
    MappingStation:
      type: object
      properties:
        id:
          type: integer
        uid:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        room_id:
          type: integer
          nullable: true
        slot_id:
          type: integer
          nullable: true
        visual_model_id:
          type: integer
          nullable: true
          description: 3D library model shown for this resource, after catalog defaults.
        layout:
          $ref: '#/components/schemas/MappingStationLayout'
        capacity:
          $ref: '#/components/schemas/MappingStationCapacity'
        conditions:
          allOf:
          - $ref: '#/components/schemas/MappingConditions'
          nullable: true
        rack:
          type: array
          items:
            $ref: '#/components/schemas/MappingRackItem'
          description: Rack-mounted equipment, bottom unit first.
      required:
      - id
      - name
      - room_id
      - sku
      - slot_id
      - uid
      x-embedded-resource: true
    MappingStationCapacity:
      type: object
      properties:
        bench_capacity:
          type: integer
          nullable: true
        rack_units:
          type: integer
          nullable: true
        rack_units_used:
          type: integer
        power_capacity_w:
          type: integer
          nullable: true
        power_reserved_w:
          type: integer
          nullable: true
        power_installed_w:
          type: number
          format: double
          description: Rated draw of equipment installed here.
        max_load_kg:
          type: integer
          nullable: true
        load_installed_kg:
          type: number
          format: double
        network_port_capacity:
          type: integer
          nullable: true
        installed_units:
          type: integer
      required:
      - bench_capacity
      - max_load_kg
      - network_port_capacity
      - power_capacity_w
      - power_reserved_w
      - rack_units
    MappingStationLayout:
      type: object
      properties:
        width_mm:
          type: integer
          nullable: true
        depth_mm:
          type: integer
          nullable: true
        height_mm:
          type: integer
          nullable: true
        orientation_degrees:
          type: integer
          nullable: true
      required:
      - depth_mm
      - height_mm
      - orientation_degrees
      - width_mm
    MappingStationSlot:
      type: object
      properties:
        id:
          type: integer
        station_id:
          type: integer
        position_index:
          type: integer
        slot_code:
          type: string
        label:
          type: string
        width_mm:
          type: integer
          nullable: true
      required:
      - id
      - label
      - position_index
      - slot_code
      - station_id
      x-embedded-resource: true
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    ResourceMappingData:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/MappingRoom'
        room_slots:
          type: array
          items:
            $ref: '#/components/schemas/MappingRoomSlot'
        stations:
          type: array
          items:
            $ref: '#/components/schemas/MappingStation'
        station_slots:
          type: array
          items:
            $ref: '#/components/schemas/MappingStationSlot'
        benches:
          type: array
          items:
            $ref: '#/components/schemas/MappingBench'
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/MappingEquipment'
        licenses:
          type: array
          items:
            $ref: '#/components/schemas/MappingLicense'
        license_assignments:
          type: array
          items:
            $ref: '#/components/schemas/MappingLicenseAssignment'
      required:
      - benches
      - equipment
      - license_assignments
      - licenses
      - room_slots
      - rooms
      - station_slots
      - stations
    ResourceMappingMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/ResourceMappingPagination'
      required:
      - pagination
    ResourceMappingPagination:
      type: object
      properties:
        rooms:
          $ref: '#/components/schemas/MappingPagination'
        room_slots:
          $ref: '#/components/schemas/MappingPagination'
        stations:
          $ref: '#/components/schemas/MappingPagination'
        station_slots:
          $ref: '#/components/schemas/MappingPagination'
        benches:
          $ref: '#/components/schemas/MappingPagination'
        equipment:
          $ref: '#/components/schemas/MappingPagination'
        licenses:
          $ref: '#/components/schemas/MappingPagination'
        license_assignments:
          $ref: '#/components/schemas/MappingPagination'
      required:
      - benches
      - equipment
      - license_assignments
      - licenses
      - room_slots
      - rooms
      - station_slots
      - stations
    ResourceMappingResponse:
      type: object
      description: Response envelope with runtime reserved keys declared dynamically
        for schema generation.
      properties:
        data:
          $ref: '#/components/schemas/ResourceMappingData'
        meta:
          $ref: '#/components/schemas/ResourceMappingMeta'
      required:
      - data
      - meta
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Resource Mappings
  description: Resource Mappings endpoints
