openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/visual-model-assets:
    get:
      operationId: labs_visual_model_assets_retrieve
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      tags:
      - Visual Models
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualModelAssetListSerializersAssetPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Visual Model Assets
    post:
      operationId: labs_visual_model_assets_create
      description: Cross-feature API foundation without domain-specific behavior.
      tags:
      - Visual Models
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetUpload'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualModelAssetSerializersAssetDetailResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualModelAssetExistingSerializersAssetDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Create Visual Model Assets
  /api/labs/visual-model-assets/{asset_id}:
    put:
      operationId: labs_visual_model_assets_update_by_asset_id
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: path
        name: asset_id
        schema:
          type: integer
        required: true
      tags:
      - Visual Models
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetDetails'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualModelAssetSerializersAssetDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '428':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Update Visual Model Assets by Asset ID
    delete:
      operationId: labs_visual_model_assets_destroy_by_asset_id
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: path
        name: asset_id
        schema:
          type: integer
        required: true
      tags:
      - Visual Models
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '428':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Delete Visual Model Assets by Asset ID
  /api/labs/visual-model-assignments:
    get:
      operationId: labs_visual_model_assignments_retrieve
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      tags:
      - Visual Models
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualModelAssignmentListSerializersAssignmentPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get Visual Model Assignments
  /api/labs/visual-model-assignments/{scope}/{target_key}:
    put:
      operationId: labs_visual_model_assignments_update_by_scope_target_key
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: path
        name: scope
        schema:
          type: string
        required: true
      - in: path
        name: target_key
        schema:
          type: string
        required: true
      tags:
      - Visual Models
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentWrite'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisualModelAssignmentSerializersAssignmentDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '428':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Update Visual Model Assignments by Scope Target Key
    delete:
      operationId: labs_visual_model_assignments_destroy_by_scope_target_key
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: path
        name: scope
        schema:
          type: string
        required: true
      - in: path
        name: target_key
        schema:
          type: string
        required: true
      tags:
      - Visual Models
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '412':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '428':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Delete Visual Model Assignments by Scope Target Key
components:
  schemas:
    Asset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        url:
          type: string
          readOnly: true
        sha256:
          type: string
          maxLength: 64
        size:
          type: integer
          maximum: 2147483647
          minimum: 0
        source_url:
          type: string
          readOnly: true
        license:
          type: string
          maxLength: 255
        rotation:
          type: number
          format: double
        surface:
          type: number
          format: double
        usage_count:
          type: integer
          readOnly: true
          description: Resources and types assigned to this model.
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name
      - sha256
      - size
      - source_url
      - updated_at
      - url
      - usage_count
    AssetDetails:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        source_url:
          oneOf:
          - type: string
            format: uri
            default: ''
          - type: string
            maxLength: 0
        license:
          type: string
          default: ''
          maxLength: 255
        rotation:
          type: number
          format: double
          maximum: 360
          minimum: -360
          default: 0.0
        surface:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 1.0
      required:
      - name
    AssetUpload:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        source_url:
          oneOf:
          - type: string
            format: uri
            default: ''
          - type: string
            maxLength: 0
        license:
          type: string
          default: ''
          maxLength: 255
        rotation:
          type: number
          format: double
          maximum: 360
          minimum: -360
          default: 0.0
        surface:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 1.0
        file:
          type: string
          format: binary
      required:
      - file
      - name
    Assignment:
      type: object
      properties:
        scope:
          type: string
          maxLength: 24
        target_key:
          type: string
          maxLength: 80
        asset_id:
          type: integer
          readOnly: true
        rotation:
          type: number
          format: double
        scale:
          type: number
          format: double
        offset_x:
          type: number
          format: double
        offset_y:
          type: number
          format: double
        offset_z:
          type: number
          format: double
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset_id
      - scope
      - target_key
      - updated_at
    AssignmentWrite:
      type: object
      properties:
        asset_id:
          type: integer
          minimum: 1
        rotation:
          type: number
          format: double
          maximum: 360
          minimum: -360
          default: 0.0
        scale:
          type: number
          format: double
          maximum: 2
          minimum: 0.01
          default: 1.0
        offset_x:
          type: number
          format: double
          maximum: 1
          minimum: -1
          default: 0.0
        offset_y:
          type: number
          format: double
          maximum: 1
          minimum: -1
          default: 0.0
        offset_z:
          type: number
          format: double
          maximum: 1
          minimum: -1
          default: 0.0
      required:
      - asset_id
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    VisualModelAssetExistingSerializersAssetDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Asset'
      required:
      - data
    VisualModelAssetListSerializersAssetPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/VisualModelAssetListSerializersAssetPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Asset'
      required:
      - data
      - meta
    VisualModelAssetListSerializersAssetPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    VisualModelAssetListSerializersAssetPaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/VisualModelAssetListSerializersAssetPagination'
      required:
      - pagination
    VisualModelAssetSerializersAssetDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Asset'
      required:
      - data
    VisualModelAssignmentListSerializersAssignmentPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/VisualModelAssignmentListSerializersAssignmentPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
      required:
      - data
      - meta
    VisualModelAssignmentListSerializersAssignmentPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    VisualModelAssignmentListSerializersAssignmentPaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/VisualModelAssignmentListSerializersAssignmentPagination'
      required:
      - pagination
    VisualModelAssignmentSerializersAssignmentDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Assignment'
      required:
      - data
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Visual Models
  description: Visual Models endpoints
