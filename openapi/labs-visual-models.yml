components:
  schemas:
    Asset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 160
        url:
          type: string
          readOnly: true
        sha256:
          type: string
          maxLength: 64
        size:
          type: integer
          maximum: 2147483647
          minimum: 0
        source_url:
          type: string
          readOnly: true
        license:
          type: string
          maxLength: 255
        rotation:
          type: number
          format: double
        surface:
          type: number
          format: double
        usage_count:
          type: integer
          readOnly: true
          description: Resources and catalog types using this model.
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - name
      - sha256
      - size
      - source_url
      - updated_at
      - url
      - usage_count
    AssetDetails:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        source_url:
          oneOf:
          - type: string
            format: uri
            default: ''
          - type: string
            maxLength: 0
        license:
          type: string
          default: ''
          maxLength: 255
        rotation:
          type: number
          format: double
          maximum: 360
          minimum: -360
          default: 0.0
        surface:
          type: number
          format: double
          maximum: 1
          minimum: 0
          default: 1.0
      required:
      - name
    AssetUpload:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        source_url:
          oneOf:
          - type: string
            format: uri
            default: ''
          - type: string
            maxLength: 0
        license:
          type: string
          default: ''
          maxLength: 255
        rotation:
          type: number
          format: double
          maximum: 360
          minimum: -360
          default: 0.0
        surface:
          type: number
          format: double
          maximum: 1
