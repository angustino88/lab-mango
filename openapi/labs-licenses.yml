        to unassign).
      parameters:
      - in: path
        name: license_id
        schema:
          type: integer
        required: true
      tags:
      - Licenses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LicenseAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LicenseAssignmentRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseAssignActionSerializersLicenseAssignmentResultDetailResponse'
          description: ''
        '400':
