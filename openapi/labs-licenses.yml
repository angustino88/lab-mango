      operationId: labs_licenses_retrieve
      description: List non-deleted license inventory with acquisition information.
      parameters:
      - in: query
        name: created_at_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_at_before
        schema:
          type: string
          format: date-time
      - in: query
        name: group_id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
      - in: query
        name: ordering
        schema:
          type: string
          minLength: 1
      - in: query
        name: owner_id
        schema:
          type: string
          minLength: 1
        description: Comma-separated values; OR within this filter.
