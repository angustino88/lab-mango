  /api/labs/license-categories:
    get:
      operationId: labs_license_categories_retrieve
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      tags:
      - Licenses
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseCategoryCatalogListSerializersLicenseCategoryPaginatedResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: The requested page does not exist (page beyond the last page).
      summary: Get License Categories
  /api/labs/license-categories/{category_id}:
    get:
      operationId: labs_license_categories_retrieve_by_category_id
      description: Cross-feature API foundation without domain-specific behavior.
      parameters:
