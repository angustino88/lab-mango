          type: integer
          minimum: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
      - in: query
        name: status
        schema:
          type: string
          minLength: 1
