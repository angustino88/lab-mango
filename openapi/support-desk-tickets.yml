  /api/support/attachments/{attachment_id}/download:
    get:
      operationId: support_attachments_download_retrieve_by_attachment_id
      description: Download an attachment file with security verification.
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: integer
        required: true
      tags:
      - Support Desk
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: Clean attachment binary (stored content type)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Restricted attachment requires support staff
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Attachment is missing, deleted, hidden, or has no binary
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Attachment scan is pending
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Attachment is quarantined as infected
      summary: Get Attachments Download by Attachment ID
