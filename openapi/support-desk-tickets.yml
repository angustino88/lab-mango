        priority:
          allOf:
          - $ref: '#/components/schemas/Priority'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status'
          readOnly: true
        requester:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
        assignee:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
        team:
          allOf:
          - $ref: '#/components/schemas/TeamSummary'
          readOnly: true
        labels:
          type: array
          items:
            type: string
          readOnly: true
        due_date:
          type: string
          format: date
          nullable: true
          description: Requester/agent-set target date, independent of the SLA.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_activity_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        sla:
          type: object
          additionalProperties: {}
          readOnly: true
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - assignee
      - category
      - created_at
      - id
      - key
      - labels
      - number
      - priority
      - requester
      - sla
      - status
      - subject
      - team
      - updated_at
    TicketListSerializersTicketListPaginatedResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        meta:
          $ref: '#/components/schemas/TicketListSerializersTicketListPaginationMeta'
        data:
          type: array
          items:
            $ref: '#/components/schemas/TicketList'
      required:
      - data
      - meta
    TicketListSerializersTicketListPagination:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
      required:
      - count
      - next
      - page
      - page_size
      - previous
    TicketListSerializersTicketListPaginationMeta:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/TicketListSerializersTicketListPagination'
      required:
      - pagination
    TicketRef:
      type: object
      description: 'REL-3 relation to another ticket; ``name`` is ``"<key>: <subject>"``.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    TicketResourceLink:
      type: object
      description: A resource link owned by the ticket (REL-15).
      properties:
        id:
          type: integer
          readOnly: true
        resource:
          allOf:
          - $ref: '#/components/schemas/LinkedResource'
          readOnly: true
        snapshot:
          type: object
          additionalProperties: {}
          readOnly: true
        is_active:
          type: boolean
        linked_at:
          type: string
          format: date-time
          readOnly: true
        linked_by:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
        unlinked_at:
          type: string
          format: date-time
          nullable: true
        unlinked_by:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
        unlink_reason:
          type: string
        badge:
          type: string
          readOnly: true
      required:
      - badge
      - id
      - linked_at
      - linked_by
      - resource
      - snapshot
      - unlinked_by
      x-embedded-resource: true
    TicketResourceLinkCreateSerializersTicketResourceLinkDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/TicketResourceLink'
      required:
      - data
    TicketTransitionRequest:
      type: object
      properties:
        to_status_id:
          type: integer
        version:
          type: integer
        reason:
          type: string
          default: ''
        resolution_summary:
          type: string
          default: ''
        root_cause:
          type: string
          default: ''
        resolution_code:
          default: ''
          oneOf:
          - $ref: '#/components/schemas/ResolutionCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
      required:
      - to_status_id
      - version
    TicketTransitionSerializersTicketDetailDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/TicketDetail'
      required:
      - data
    TicketTypeEnum:
      enum:
      - incident
      - service_request
      - problem
      - change
      - question
      type: string
      description: '* `incident` - Incident

        * `service_request` - Service Request

        * `problem` - Problem

        * `change` - Change

        * `question` - Question'
    TicketUpdateSerializersTicketDetailDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/TicketDetail'
      required:
      - data
    TicketWatcherAddSerializersWatcherDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/Watcher'
      required:
      - data
    UrgencyEnum:
      enum:
      - '1'
      - '2'
      - '3'
      type: string
      description: '* `1` - High

        * `2` - Medium

        * `3` - Low'
    UserReference:
      type: object
      description: REL-3 user relation ``{id, name}``; duck-typed so any feature may
        use it without importing users.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    VisibilityEnum:
      enum:
      - public
      - internal
      type: string
      description: '* `public` - public

        * `internal` - internal'
    Watcher:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/UserReference'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - user
    WatcherRequest:
      type: object
      properties:
        user_id:
          type: integer
          nullable: true
          description: Defaults to the caller.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
