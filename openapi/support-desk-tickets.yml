  /api/support/categories/options:
    get:
      operationId: support_categories_options_retrieve
      description: Options selector endpoint for active categories.
      parameters:
      - in: query
        name: include_ids
        schema:
          type: array
          items:
            type: integer
            minimum: 1
          maxItems: 50
          uniqueItems: true
        description: Comma-separated positive integers (at most 50) of retired rows
          to include.
        style: form
        explode: false
      - in: query
        name: q
        schema:
          type: string
          maxLength: 100
          minLength: 1
        description: Search text (1 to 100 characters).
      tags:
      - Support Desk
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOptionList'
          description: Standard selector options list
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Invalid selector query parameters (invalid_query) or result
            cap exceeded (too_many_results).
        '304':
          description: Not modified
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Access denied by the existing API-key or authenticated-user
            permission policy.
      x-owner: tickets
      summary: Get Categories Options
