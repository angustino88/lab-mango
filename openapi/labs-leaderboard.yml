openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/labs/benches/{id}/assessment:
    get:
      operationId: labs_benches_assessment_retrieve_by_id
      description: KPI assessment of one bench. Lab coordinators and administrators
        only.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          minLength: 1
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: start_date
        schema:
          type: string
          minLength: 1
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchAssessmentSerializersAssessmentDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Benches Assessment by ID
  /api/labs/benches/{id}/profile:
    get:
      operationId: labs_benches_profile_retrieve_by_id
      description: Retrieve laboratory bench performance profile.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          minLength: 1
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: start_date
        schema:
          type: string
          minLength: 1
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabProfileSerializersLabProfileDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Benches Profile by ID
  /api/labs/benches/{id}/weekly-usage:
    get:
      operationId: labs_benches_weekly_usage_retrieve_by_id
      description: Weekly utilization heatmap for a specific laboratory bench.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabWeeklyUsageSerializersWeeklyUsageSlotListResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Benches Weekly Usage by ID
  /api/labs/lab-dashboard:
    get:
      operationId: labs_lab_dashboard_retrieve
      description: Laboratory dashboard overview with polymorphic paginated or unpaginated
        list.
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabDashboardResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Lab Dashboard
  /api/labs/leaderboard/export:
    get:
      operationId: labs_leaderboard_export_retrieve
      description: Export leaderboard performance data.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          minLength: 1
      - in: query
        name: start_date
        schema:
          type: string
          minLength: 1
      - in: query
        name: type
        schema:
          enum:
          - persona
          - lab
          type: string
          default: persona
          minLength: 1
        description: '* `persona` - persona

          * `lab` - lab'
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardExportSerializersLeaderboardPersonaListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Leaderboard Export
  /api/labs/leaderboard/lab:
    get:
      operationId: labs_leaderboard_lab_retrieve
      description: Laboratory and bench utilization rankings.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          minLength: 1
      - in: query
        name: start_date
        schema:
          type: string
          minLength: 1
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardLabSerializersLeaderboardLabListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Leaderboard Lab
  /api/labs/leaderboard/persona:
    get:
      operationId: labs_leaderboard_persona_retrieve
      description: User performance rankings and operational metrics.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          minLength: 1
      - in: query
        name: start_date
        schema:
          type: string
          minLength: 1
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardPersonaSerializersLeaderboardPersonaListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Leaderboard Persona
  /api/labs/leaderboard/users/{id}/assessment:
    get:
      operationId: labs_leaderboard_users_assessment_retrieve_by_id
      description: 'KPI assessment of one user: scorecard, rating, strengths, development
        areas and trend.


        Lab coordinators and administrators only: the rankings are visible to every
        lab member, the

        assessment of a person is not.'
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          minLength: 1
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: start_date
        schema:
          type: string
          minLength: 1
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAssessmentSerializersAssessmentDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Leaderboard Users Assessment by ID
  /api/labs/leaderboard/users/{id}/profile:
    get:
      operationId: labs_leaderboard_users_profile_retrieve_by_id
      description: User profile ranking and session summary.
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          minLength: 1
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: start_date
        schema:
          type: string
          minLength: 1
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSerializersUserProfileDetailResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Leaderboard Users Profile by ID
  /api/labs/leaderboard/users/{id}/weekly-usage:
    get:
      operationId: labs_leaderboard_users_weekly_usage_retrieve_by_id
      description: Weekly usage heatmap for an individual user.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Leaderboard
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWeeklyUsageSerializersWeeklyUsageSlotListResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: ''
      summary: Get Leaderboard Users Weekly Usage by ID
components:
  schemas:
    BenchAssessmentSerializersAssessmentDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/LeaderboardAssessment'
      required:
      - data
    Choice:
      type: object
      description: ENU-1 ``{value, label}``.
      properties:
        value:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
      required:
      - label
      - value
    DashboardLabItem:
      type: object
      description: Item representation in dashboard laboratory listing.
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        status:
          type: string
          default: available
      required:
      - id
      - name
    DashboardPaginatedResponse:
      type: object
      description: Paginated envelope for dashboard laboratory listings.
      properties:
        meta:
          type: object
          additionalProperties: {}
        data:
          type: array
          items:
            $ref: '#/components/schemas/DashboardLabItem'
      required:
      - data
      - meta
    DashboardUnpaginatedResponse:
      type: object
      description: Unpaginated envelope for dashboard laboratory listings.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DashboardLabItem'
      required:
      - data
    LabDashboardResponse:
      oneOf:
      - $ref: '#/components/schemas/DashboardUnpaginatedResponse'
      - $ref: '#/components/schemas/DashboardPaginatedResponse'
    LabProfile:
      type: object
      description: Laboratory bench profile metrics and usage statistics.
      properties:
        id:
          type: integer
        name:
          type: string
        sku:
          type: string
        total_sessions:
          type: integer
        active_users:
          type: integer
        top_projects:
          type: array
          items:
            type: string
      required:
      - active_users
      - id
      - name
      - total_sessions
    LabProfileSerializersLabProfileDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/LabProfile'
      required:
      - data
    LabWeeklyUsageSerializersWeeklyUsageSlotListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyUsageSlot'
      required:
      - data
    LeaderboardAssessment:
      type: object
      description: KPI assessment of a user or bench. Lab coordinators and administrators
        only.
      properties:
        period:
          $ref: '#/components/schemas/LeaderboardAssessmentPeriod'
        previous_period:
          $ref: '#/components/schemas/LeaderboardAssessmentPeriod'
        rating:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        score:
          type: integer
          nullable: true
          description: Weighted KPI score 0-100; null with too little data.
        previous_score:
          type: integer
          nullable: true
          description: Score of the previous period.
        summary:
          type: string
        total_sessions:
          type: integer
        total_bookings:
          type: integer
        kpis:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardAssessmentKpi'
        strengths:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardAssessmentStrength'
        development_areas:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardAssessmentDevelopmentArea'
      required:
      - development_areas
      - kpis
      - period
      - previous_period
      - previous_score
      - rating
      - score
      - strengths
      - summary
      - total_bookings
      - total_sessions
    LeaderboardAssessmentDevelopmentArea:
      type: object
      properties:
        kpi:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        text:
          type: string
          description: The finding, with the figure behind it.
        recommendation:
          type: string
          description: The recommended action.
      required:
      - kpi
      - recommendation
      - severity
      - text
    LeaderboardAssessmentKpi:
      type: object
      description: 'One scorecard line: the KPI against its target, with the previous
        period for the trend.'
      properties:
        kpi:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        value:
          type: number
          format: double
          nullable: true
          description: 0-1; null when the KPI does not apply.
        previous_value:
          type: number
          format: double
          nullable: true
          description: Same KPI in the previous period.
        target:
          type: number
          format: double
          description: 0-1 target; a ceiling when is_higher_better is false.
        is_higher_better:
          type: boolean
        weight:
          type: integer
          description: Weight in the overall score.
        status:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
      required:
      - is_higher_better
      - kpi
      - previous_value
      - status
      - target
      - value
      - weight
    LeaderboardAssessmentPeriod:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
      required:
      - ends_at
      - starts_at
    LeaderboardAssessmentStrength:
      type: object
      properties:
        kpi:
          allOf:
          - $ref: '#/components/schemas/Choice'
          readOnly: true
        text:
          type: string
      required:
      - kpi
      - text
    LeaderboardExportSerializersLeaderboardPersonaListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardPersona'
      required:
      - data
    LeaderboardLab:
      type: object
      description: Utilization rankings for laboratories and benches.
      properties:
        id:
          type: integer
        name:
          type: string
        points:
          type: integer
        total_sessions:
          type: integer
        active_users:
          type: integer
          default: 0
        last_remote_at:
          type: string
          format: date-time
          nullable: true
        total_usage_minutes:
          type: number
          format: double
          default: 0.0
          description: Active minutes on the bench.
        utilization_rate:
          type: number
          format: double
          default: 0.0
          description: Active time against 8 hours per weekday, 0-1.
        booking_fill:
          type: number
          format: double
          default: 0.0
          description: Booked time against 8 hours per weekday, 0-1.
        total_bookings:
          type: integer
          default: 0
        no_show_bookings:
          type: integer
          default: 0
          description: Bookings with no session.
        booking_compliance:
          type: number
          format: double
          nullable: true
          description: Attended bookings against approved bookings that have started,
            0-1; null without bookings.
        booking_utilization:
          type: number
          format: double
          nullable: true
          description: Booked time actually used against booked time, 0-1; null without
            bookings.
        downtime_minutes:
          type: number
          format: double
          default: 0.0
        top_projects:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - points
      - total_sessions
    LeaderboardLabSerializersLeaderboardLabListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardLab'
      required:
      - data
    LeaderboardPersona:
      type: object
      description: Ranking metrics and performance breakdown for individual users.
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
          default: ''
        avatar:
          type: string
          nullable: true
        points:
          type: integer
        wfo_rate:
          type: number
          format: double
          default: 0.0
        wfh_rate:
          type: number
          format: double
          default: 0.0
        late_rate:
          type: number
          format: double
          default: 0.0
        usage_efficiency:
          type: number
          format: double
          default: 0.0
          description: Active lab time against 8 hours per weekday, 0-1.
        active_rate:
          type: number
          format: double
          nullable: true
          description: Active time against total session time, 0-1; null without sessions.
        ad_hoc_rate:
          type: number
          format: double
          nullable: true
          description: Sessions without a verified booking against all sessions, 0-1;
            null without sessions.
        booking_compliance:
          type: number
          format: double
          nullable: true
          description: Attended bookings (at least one session) against approved bookings
            that have started, 0-1; null without bookings.
        booking_utilization:
          type: number
          format: double
          nullable: true
          description: Booked time actually used against booked time, 0-1; null without
            bookings.
        slot_adherence:
          type: number
          format: double
          nullable: true
          description: Session time inside the booked slot against all time of booked
            sessions, 0-1; null when no booking was attended.
        no_show_bookings:
          type: integer
          default: 0
          description: Bookings with no session.
        last_remote_at:
          type: string
          format: date-time
          nullable: true
        labs_accessed:
          type: integer
          default: 0
        total_bookings:
          type: integer
          default: 0
        total_sessions:
          type: integer
        total_usage_minutes:
          type: number
          format: double
          default: 0.0
        active_usage_minutes:
          type: number
          format: double
          default: 0.0
          description: Active minutes in sessions.
        avg_session_minutes:
          type: number
          format: double
          default: 0.0
        longest_session_minutes:
          type: number
          format: double
          default: 0.0
        top_projects:
          type: array
          items:
            type: string
      required:
      - id
      - points
      - total_sessions
      - username
    LeaderboardPersonaSerializersLeaderboardPersonaListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardPersona'
      required:
      - data
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
    UserAssessmentSerializersAssessmentDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/LeaderboardAssessment'
      required:
      - data
    UserProfile:
      type: object
      description: User profile overview and ranking metrics.
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
          default: ''
        total_sessions:
          type: integer
        points:
          type: integer
        top_projects:
          type: array
          items:
            type: string
      required:
      - id
      - points
      - total_sessions
      - username
    UserProfileSerializersUserProfileDetailResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          $ref: '#/components/schemas/UserProfile'
      required:
      - data
    UserWeeklyUsageSerializersWeeklyUsageSlotListResponse:
      type: object
      description: Base serializer for successful API responses.
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyUsageSlot'
      required:
      - data
    WeeklyUsageSlot:
      type: object
      description: Weekly utilization heatmap slot.
      properties:
        day:
          type: integer
        hour:
          type: integer
        usage:
          type: number
          format: double
      required:
      - day
      - hour
      - usage
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Leaderboard
  description: Leaderboard endpoints
