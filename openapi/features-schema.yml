openapi: 3.0.3
info:
  title: LabMango API
  version: 1.0.0
  description: LabMango Backend REST API
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: Retrieve the OpenAPI contract. Select YAML or JSON through content
        negotiation or the format query parameter.
      summary: Get OpenAPI Schema
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - Schema
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/vnd.oai.openapi:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
            application/vnd.oai.openapi+json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Missing or invalid credentials; includes WWW-Authenticate.
        '403':
          content:
            application/vnd.oai.openapi:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
            application/vnd.oai.openapi+json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemResponseEnvelope'
          description: Authenticated user is not a staff user (IsAdminUser).
components:
  schemas:
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
        request_id:
          type: string
      required:
      - code
      - details
      - message
      - request_id
    ProblemResponseEnvelope:
      type: object
      description: Document the envelope emitted by ResponseContract.respond_problem().
      properties:
        error:
          $ref: '#/components/schemas/ProblemDetail'
      required:
      - error
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: ''
  description: Local Development Server
tags:
- name: Schema
  description: Schema endpoints
